name: Land
description: Fast-forward main to the commit this run proved, and to nothing else
inputs:
  sha:
    description: The commit the run tested
    default: ${{ github.sha }}
  release:
    description: Tag the commit with its manifest's version when that version has no tag yet
    default: 'false'
  directory:
    description: The package's directory in the repository, for the release
    default: '.'
runs:
  using: composite
  steps:
    - name: Fast-forward main
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ inputs.sha }}
      run: |
        # Never forced: the API refuses a ref update that is not a fast-forward,
        # and a main that moved since the run began is reported, not overwritten.
        main=$(gh api "repos/$REPO/commits/main" --jq .sha)
        if [ "$main" = "$SHA" ]; then
          echo "main is already at $SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        status=$(gh api "repos/$REPO/compare/$main...$SHA" --jq .status)
        if [ "$status" != ahead ]; then
          echo "::error title=Not a fast-forward::main is at $main, and $SHA is $status of it; rebase the branch on main and run the merge tier again"
          exit 1
        fi
        gh api --method PATCH "repos/$REPO/git/refs/heads/main" -f sha="$SHA" -F force=false > /dev/null
        echo "Landed: main moved from $main to $SHA" | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Tag the release
      if: inputs.release == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ inputs.sha }}
        DIRECTORY: ${{ inputs.directory }}
      run: |
        # The version is the manifest's at the landed commit. A tag that exists is left where it is:
        # a tag is never moved or overwritten.
        path="${DIRECTORY#./}/build.zig.zon"
        path="${path#/}"
        version=$(gh api -H "Accept: application/vnd.github.raw+json" "repos/$REPO/contents/$path?ref=$SHA" | sed -n 's/^[[:space:]]*\.version = "\([0-9][0-9.]*\)".*/\1/p' | head -n 1)
        if [ -z "$version" ]; then
          echo "::error title=No version::$path at $SHA has no .version to tag"
          exit 1
        fi
        tag="v$version"
        if [ -n "$(gh api "repos/$REPO/git/matching-refs/tags/$tag" --jq '.[] | select(.ref == "refs/tags/'"$tag"'") | .ref')" ]; then
          echo "$tag exists; it is not moved" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        gh api --method POST "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" > /dev/null
        echo "Tagged $SHA as $tag" | tee -a "$GITHUB_STEP_SUMMARY"
