name: Land
description: Fast-forward the default branch to the commit this run proved, and to nothing else
inputs:
  sha:
    description: The commit the run tested
    default: ${{ github.sha }}
  version:
    description: The version to tag the commit with, as the gate read it from build.zig.zon; empty tags nothing
    default: ''
runs:
  using: composite
  steps:
    - name: Fast-forward the default branch
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ inputs.sha }}
      run: |
        # Never forced: the API refuses a ref update that is not a fast-forward,
        # and a default branch that moved since the run began is reported, not overwritten.
        branch=$(gh api "repos/$REPO" --jq .default_branch)
        tip=$(gh api "repos/$REPO/commits/$branch" --jq .sha)
        if [ "$tip" = "$SHA" ]; then
          echo "$branch is already at $SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        status=$(gh api "repos/$REPO/compare/$tip...$SHA" --jq .status)
        if [ "$status" != ahead ]; then
          echo "::error title=Not a fast-forward::$branch is at $tip, and $SHA is $status of it; rebase the branch on $branch and run the merge tier again"
          exit 1
        fi
        gh api --method PATCH "repos/$REPO/git/refs/heads/$branch" -f sha="$SHA" -F force=false > /dev/null
        echo "Landed: $branch moved from $tip to $SHA" | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Tag the release
      if: inputs.version != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ inputs.sha }}
        VERSION: ${{ inputs.version }}
      run: |
        # A tag that exists is left where it is: a tag is never moved or overwritten.
        tag="v$VERSION"
        if [ -n "$(gh api "repos/$REPO/git/matching-refs/tags/$tag" --jq '.[] | select(.ref == "refs/tags/'"$tag"'") | .ref')" ]; then
          echo "$tag exists; it is not moved" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        gh api --method POST "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" > /dev/null
        echo "Tagged $SHA as $tag" | tee -a "$GITHUB_STEP_SUMMARY"
