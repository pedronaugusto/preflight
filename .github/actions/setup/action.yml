name: Zig setup
description: Install Zig, take the prebuilt checks and restore the package, product and external-tool caches; fetch with retries
inputs:
  working-directory:
    description: Package root
    default: .
  build-key:
    description: The kind of job, which scopes the caches; no commas
    default: extras
  build-args:
    description: The arguments the job builds with; the fetch configures that build and fetches what it asks for
    default: ''
  zig-version:
    description: The Zig to install, 0.17.0 or master; cache keys carry it
    default: 0.17.0
  toolchain:
    description: The artifact holding the checks built for this runner; empty builds them here, as the Zig master leg must with its own Zig
    default: ''
  windows-git-latest:
    description: Upgrade Git for Windows to the latest release
    default: 'false'
runs:
  using: composite
  steps:
    - name: Upgrade Git for Windows
      if: runner.os == 'Windows' && inputs.windows-git-latest == 'true'
      shell: pwsh
      run: |
        # Chocolatey's mirror fails now and then; the rest of the job should not.
        foreach ($attempt in 1..3) {
          choco upgrade git -y --no-progress
          if ($LASTEXITCODE -eq 0) { break }
          Start-Sleep -Seconds (5 * $attempt)
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git --version
    - uses: actions/download-artifact@v4
      if: inputs.toolchain != ''
      with:
        name: ${{ inputs.toolchain }}
        path: .preflight-bin
    - name: Put the prebuilt checks on the path
      if: inputs.toolchain != ''
      shell: bash
      run: |
        case "$RUNNER_OS" in Linux) dir=linux ;; macOS) dir=macos ;; Windows) dir=windows ;; esac
        chmod +x .preflight-bin/$dir/preflight* 2> /dev/null || true
        echo "$GITHUB_WORKSPACE/.preflight-bin/$dir" >> "$GITHUB_PATH"
    - uses: mlugg/setup-zig@v2
      with:
        version: ${{ inputs.zig-version }}
        use-cache: false
    # What the build of the package makes stays in .zig-cache and is not kept:
    # the next run changes the sources, and what a run built from them is of no
    # use to it, though it fills a gigabyte. Zig's own cache holds what lasts.
    - name: Keep Zig's own cache apart from the package's
      shell: bash
      run: |
        echo "ZIG_GLOBAL_CACHE_DIR=${RUNNER_TEMP}/zig-global" >> "$GITHUB_ENV"
        echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      id: global
    - name: Cache fetched Zig packages
      id: packages
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/zig-global/p
        # Zig compiles the build script of every package it finds here, asked
        # for or not, so a job restores only what a configured fetch of its own
        # kind saved: the Zig master leg never meets a script written for another Zig.
        key: zig-packages-${{ runner.os }}-${{ inputs.zig-version }}-${{ inputs.build-key }}-${{ hashFiles('**/build.zig.zon') }}
    # The build runner every `zig build` compiles first, and the compiler's
    # runtime for each target, which Zig builds on first use. The key is the
    # same for every kind of job and is renewed weekly; a run on main fills it
    # (the warm job), since a branch sees the caches of main and its own.
    - name: Cache what Zig builds for itself
      id: products
      uses: actions/cache@v4
      with:
        path: |
          ${{ runner.temp }}/zig-global/o
          ${{ runner.temp }}/zig-global/h
          ${{ runner.temp }}/zig-global/z
          ${{ runner.temp }}/zig-global/b
        key: zig-products-${{ runner.os }}-${{ runner.arch }}-${{ inputs.zig-version }}-${{ steps.global.outputs.week }}
        restore-keys: |
          zig-products-${{ runner.os }}-${{ runner.arch }}-${{ inputs.zig-version }}-
    - name: Cache external tools
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/preflight-tools
        key: preflight-tools-${{ runner.os }}-${{ runner.arch }}-${{ inputs.zig-version }}-${{ hashFiles('**/ci/setup.zig') }}
    - name: Fetch what the job's build asks for, with retries
      env:
        BUILD_ARGS: ${{ inputs.build-args }}
        PREBUILT: ${{ inputs.toolchain }}
      working-directory: ${{ inputs.working-directory }}
      run: |
        before=$(ls "$ZIG_GLOBAL_CACHE_DIR/o" 2> /dev/null | wc -l)
        started=$(date +%s)
        if [ -n "$PREBUILT" ]; then
          preflight fetch
        else
          zig build --build-file "$GITHUB_WORKSPACE/.preflight/build.zig" -Drepo-root="$PWD" fetch
        fi
        after=$(ls "$ZIG_GLOBAL_CACHE_DIR/o" | wc -l)
        echo "- phase \`fetch\`: $(($(date +%s) - started)) s; Zig's own cache held $before entries before it and $after after" | tee -a "$GITHUB_STEP_SUMMARY"
      shell: bash
    - name: Record cache hits
      env:
        PREFLIGHT_PACKAGE_HIT: ${{ steps.packages.outputs.cache-hit }}
        PREFLIGHT_BUILD_HIT: ${{ steps.products.outputs.cache-hit }}
        PREBUILT: ${{ inputs.toolchain }}
      run: |
        if [ -n "$PREBUILT" ]; then
          preflight setup
        else
          zig build --build-file "$GITHUB_WORKSPACE/.preflight/build.zig" -Drepo-root="$GITHUB_WORKSPACE" setup -- --report
        fi
      shell: bash
