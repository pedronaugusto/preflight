name: Zig setup
description: Install Zig and restore package, build and external-tool caches; fetch with retries
inputs:
  working-directory:
    description: Package root
    default: .
  build-key:
    description: Stable cache scope without commas
    default: extras
  build-args:
    description: The arguments the job builds with; the fetch configures that build and fetches what it asks for
    default: ''
  zig-version:
    description: The Zig to install, 0.17.0 or master; cache keys carry it
    default: 0.17.0
  windows-git-latest:
    description: Upgrade Git for Windows to the latest release
    default: 'false'
runs:
  using: composite
  steps:
    - name: Upgrade Git for Windows
      if: runner.os == 'Windows' && inputs.windows-git-latest == 'true'
      shell: pwsh
      run: |
        choco upgrade git -y --no-progress
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git --version
    - uses: mlugg/setup-zig@v2
      with:
        version: ${{ inputs.zig-version }}
        use-cache: false
    - name: Cache fetched Zig packages
      id: packages
      uses: actions/cache@v4
      with:
        path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}/p
        # Zig compiles the build script of every package it finds here, asked
        # for or not, so a job restores only what a configured fetch saved:
        # the Zig master leg never meets a script written for another Zig.
        key: zig-packages-configured-${{ runner.os }}-${{ inputs.zig-version }}-${{ hashFiles('**/build.zig.zon') }}
        restore-keys: |
          zig-packages-configured-${{ runner.os }}-${{ inputs.zig-version }}-
    - name: Cache compiled builds
      id: builds
      uses: actions/cache@v4
      with:
        path: |
          ${{ inputs.working-directory }}/.zig-cache
          .preflight/.zig-cache
          ${{ env.ZIG_GLOBAL_CACHE_DIR }}/o
          ${{ env.ZIG_GLOBAL_CACHE_DIR }}/h
          ${{ env.ZIG_GLOBAL_CACHE_DIR }}/z
        key: zig-build-${{ runner.os }}-${{ runner.arch }}-${{ inputs.zig-version }}-${{ inputs.build-key }}-${{ hashFiles('**/*.zig', '**/*.zon', '**/ci/*.json') }}
        restore-keys: |
          zig-build-${{ runner.os }}-${{ runner.arch }}-${{ inputs.zig-version }}-${{ inputs.build-key }}-
          zig-build-${{ runner.os }}-${{ runner.arch }}-${{ inputs.zig-version }}-
    - name: Cache external tools
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/preflight-tools
        key: preflight-tools-${{ runner.os }}-${{ runner.arch }}-${{ inputs.zig-version }}-${{ hashFiles('**/ci/setup.zig') }}
    - name: Fetch what the job's build asks for, with retries
      env:
        BUILD_ARGS: ${{ inputs.build-args }}
      run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" fetch
      shell: bash
    - name: Record cache hits
      env:
        PREFLIGHT_PACKAGE_HIT: ${{ steps.packages.outputs.cache-hit }}
        PREFLIGHT_BUILD_HIT: ${{ steps.builds.outputs.cache-hit }}
      run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}" setup -- --report
      shell: bash
