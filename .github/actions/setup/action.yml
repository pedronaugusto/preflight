name: Zig setup
description: Install Zig and restore package, build and external-tool caches; fetch with retries
inputs:
  working-directory:
    description: Package root
    default: .
  build-key:
    description: Stable cache scope without commas
    default: extras
  install-zig:
    description: Install Zig unless the container already supplies it
    default: 'true'
runs:
  using: composite
  steps:
    - uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0
        use-cache: false
      if: inputs.install-zig == 'true'
    - name: Cache fetched Zig packages
      id: packages
      uses: actions/cache@v4
      with:
        path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}/p
        key: zig-packages-${{ runner.os }}-0.16.0-${{ hashFiles('**/build.zig.zon') }}
        restore-keys: |
          zig-packages-${{ runner.os }}-0.16.0-
    - name: Cache compiled builds
      id: builds
      uses: actions/cache@v4
      with:
        path: |
          ${{ inputs.working-directory }}/.zig-cache
          .preflight/.zig-cache
          ${{ env.ZIG_GLOBAL_CACHE_DIR }}/o
          ${{ env.ZIG_GLOBAL_CACHE_DIR }}/h
          ${{ env.ZIG_GLOBAL_CACHE_DIR }}/z
        key: zig-build-${{ runner.os }}-${{ runner.arch }}-0.16.0-${{ inputs.build-key }}-${{ hashFiles('**/*.zig', '**/*.zon', '**/ci/*.json') }}
        restore-keys: |
          zig-build-${{ runner.os }}-${{ runner.arch }}-0.16.0-${{ inputs.build-key }}-
          zig-build-${{ runner.os }}-${{ runner.arch }}-0.16.0-
    - name: Cache external tools
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/preflight-tools
        key: preflight-tools-${{ runner.os }}-${{ runner.arch }}-0.16.0-${{ hashFiles('**/ci/setup.zig') }}
    - name: Fetch dependencies with retries
      run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" fetch
      shell: bash
    - name: Record cache hits
      env:
        PREFLIGHT_PACKAGE_HIT: ${{ steps.packages.outputs.cache-hit }}
        PREFLIGHT_BUILD_HIT: ${{ steps.builds.outputs.cache-hit }}
      run: zig build --build-file .preflight/build.zig setup -- --report
      shell: bash
