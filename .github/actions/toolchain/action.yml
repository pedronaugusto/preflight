name: Toolchain
description: Put preflight's checks, built for the Linux, macOS and Windows runners, in .preflight-bin; compiled once per pinned commit and never by the jobs that use them
inputs:
  preflight-ref:
    description: The preflight commit the caller is pinned to, checked out at .preflight
    required: true
  runners:
    description: The runners to build for, space-separated (linux linux-arm macos windows windows-arm), those the run's jobs run on
    required: false
    default: linux linux-arm macos windows windows-arm
outputs:
  source:
    description: Where the toolchain came from, cache, published or built
    value: ${{ steps.cache.outputs.cache-hit == 'true' && 'cache' || steps.published.outputs.found == 'true' && 'published' || 'built' }}
runs:
  using: composite
  steps:
    - name: Restore the toolchain of this commit
      id: cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .preflight-bin
        # The runners are in the key: a run of fewer leaves no cache a run of more would take.
        key: preflight-toolchain-${{ inputs.preflight-ref }}-${{ inputs.runners }}
    # preflight's own run of a commit builds the toolchain for it and keeps it
    # ninety days under this name, so the callers pinned to the commit take it.
    - name: Take the toolchain preflight built for this commit
      id: published
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REF: ${{ inputs.preflight-ref }}
        RUNNERS: ${{ inputs.runners }}
      run: |
        mkdir -p .preflight-bin
        id=$(gh api "repos/pedronaugusto/preflight/actions/artifacts?name=toolchain-$REF&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | first | .id // empty' || true)
        # A published toolchain holds the runners its run built: one without a runner this run
        # needs is built again, every runner this run names.
        complete() {
          for runner in $RUNNERS; do [ -e ".preflight-bin/$runner/preflight" ] || [ -e ".preflight-bin/$runner/preflight.exe" ] || return 1; done
        }
        if [ -n "$id" ] && gh api "repos/pedronaugusto/preflight/actions/artifacts/$id/zip" > "$RUNNER_TEMP/toolchain.zip" && unzip -q -o "$RUNNER_TEMP/toolchain.zip" -d .preflight-bin && complete; then
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Took preflight's toolchain for $REF (artifact $id)"
        else
          rm -rf .preflight-bin
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "No published toolchain for $REF; building it"
        fi
    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      if: steps.cache.outputs.cache-hit != 'true' && steps.published.outputs.found != 'true'
      with:
        version: 0.17.0
        use-cache: false
    - name: Build the toolchain for every runner
      if: steps.cache.outputs.cache-hit != 'true' && steps.published.outputs.found != 'true'
      shell: bash
      env:
        RUNNERS: ${{ inputs.runners }}
      run: |
        zig build --build-file .preflight/build.zig -Drepo-root="$GITHUB_WORKSPACE" toolchain -Dtoolchain-runners="$RUNNERS" -p "$RUNNER_TEMP/toolchain"
        find "$RUNNER_TEMP/toolchain/toolchain" -name '*.pdb' -delete
        cp -R "$RUNNER_TEMP/toolchain/toolchain" .preflight-bin
    - name: Allow the checks to run
      shell: bash
      run: chmod +x .preflight-bin/*/*
    - name: Keep the toolchain for the next run of this commit
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .preflight-bin
        key: preflight-toolchain-${{ inputs.preflight-ref }}-${{ inputs.runners }}
