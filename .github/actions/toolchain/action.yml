name: Toolchain
description: Put preflight's checks and bay, built for one hosted runner, in .preflight-bin/<runner>; compiled once per pinned commit and runner, and never by the jobs that use them
inputs:
  preflight-ref:
    description: The preflight commit the caller is pinned to, checked out at .preflight
    required: true
  runner:
    description: The runner to build for (linux, linux-arm, macos, windows or windows-arm); the toolchain job runs once per runner the tier's jobs run on
    required: true
outputs:
  source:
    description: Where the toolchain came from, cache, published or built
    value: ${{ steps.cache.outputs.cache-hit == 'true' && 'cache' || steps.published.outputs.found == 'true' && 'published' || 'built' }}
runs:
  using: composite
  steps:
    # One runner's build per key: a release or nightly run of a commit takes the runners its
    # ci run built, and builds only the ones that run had no job on.
    - name: Restore the toolchain of this commit and runner
      id: cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .preflight-bin
        key: preflight-toolchain-${{ inputs.preflight-ref }}-${{ inputs.runner }}
    # preflight's own run of a commit builds the toolchain for it and keeps it ninety days,
    # one artifact per runner under this name, so the callers pinned to the commit take it.
    - name: Take the toolchain preflight built for this commit and runner
      id: published
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        NAME: toolchain-${{ inputs.preflight-ref }}-${{ inputs.runner }}
      run: |
        mkdir -p .preflight-bin
        id=$(gh api "repos/pedronaugusto/preflight/actions/artifacts?name=$NAME&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | first | .id // empty' || true)
        if [ -n "$id" ] && gh api "repos/pedronaugusto/preflight/actions/artifacts/$id/zip" > "$RUNNER_TEMP/toolchain.zip" && unzip -q -o "$RUNNER_TEMP/toolchain.zip" -d .preflight-bin; then
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Took preflight's $NAME (artifact $id)"
        else
          rm -rf .preflight-bin
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "No published $NAME; building it"
        fi
    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      if: steps.cache.outputs.cache-hit != 'true' && steps.published.outputs.found != 'true'
      with:
        version: 0.17.0
        use-cache: false
    - name: Build the toolchain for the runner
      if: steps.cache.outputs.cache-hit != 'true' && steps.published.outputs.found != 'true'
      shell: bash
      env:
        RUNNER: ${{ inputs.runner }}
      run: |
        zig build --build-file .preflight/build.zig -Drepo-root="$GITHUB_WORKSPACE" toolchain -Dtoolchain-runners="$RUNNER" -p "$RUNNER_TEMP/toolchain"
        find "$RUNNER_TEMP/toolchain/toolchain" -name '*.pdb' -delete
        cp -R "$RUNNER_TEMP/toolchain/toolchain" .preflight-bin
    - name: Allow the checks to run
      shell: bash
      run: chmod +x .preflight-bin/*/*
    - name: Keep the toolchain for the next run of this commit and runner
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .preflight-bin
        key: preflight-toolchain-${{ inputs.preflight-ref }}-${{ inputs.runner }}
