name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tier:
        description: fast, merge (the candidate for main) or release (before a cut, or after threading or platform work)
        type: choice
        options: [fast, merge, release]
        default: fast
      status-only:
        description: Verify the recorded merge or release tier for this exact commit
        type: boolean
        default: false
  pull_request:
  merge_group:
concurrency:
  # Main status runs must not share the replaceable branch queue.
  group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-status-{0}', github.run_id) || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  actions: read
jobs:
  skip:
    if: github.event_name != 'push' && !inputs.status-only
    uses: ./.github/workflows/skip.yml
    with:
      tier: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || 'merge' }}
      preflight-ref: ${{ github.sha }}
      working-directory: sample
  sample:
    needs: skip
    if: always() && (github.event_name == 'push' || inputs.status-only || (needs.skip.result == 'success' && needs.skip.outputs.docs-only != 'true'))
    uses: ./.github/workflows/zig.yml
    with:
      tier: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || 'merge' }}
      working-directory: sample
      preflight-ref: ${{ github.sha }}
      attest: ${{ github.event_name == 'push' || inputs.status-only }}
      # Generated from ci/workflow.json with zig build plan -- --tier fast.
      fast-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"Linux Debug","step":"preflight-fast","args":"-Doptimize=Debug","shard":"","setup":true,"job_timeout":20,"cache_key":"fast-linux-debug-0","artifact":""}]}
      # Generated with zig build plan -- --tier merge.
      merge-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"Linux Debug","step":"preflight-fast","args":"-Doptimize=Debug -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"fast-linux-debug-0","artifact":""}]}
      merge-compile-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"compile for test (macos-latest, Debug)","step":"ci-build","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true -Dtarget=aarch64-macos","shard":"","setup":false,"job_timeout":20,"cache_key":"compile-6313ab52f19777ed","artifact":"preflight-6313ab52f19777ed"},{"os":"ubuntu-latest","name":"compile for test (windows-latest, Debug)","step":"ci-build","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true -Dtarget=x86_64-windows-gnu","shard":"","setup":false,"job_timeout":20,"cache_key":"compile-68bbf534cd2c09ea","artifact":"preflight-68bbf534cd2c09ea"}]}
      merge-run-matrix: >-
        {"include":[{"os":"macos-latest","name":"test (macos-latest, Debug)","step":"ci-run","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"6313ab52f19777ed","artifact":"preflight-6313ab52f19777ed"},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 1/2","step":"ci-run","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"1/2","setup":true,"job_timeout":20,"cache_key":"89ffbffa950da5d3","artifact":"preflight-68bbf534cd2c09ea"},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 2/2","step":"ci-run","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"2/2","setup":true,"job_timeout":20,"cache_key":"df84cd491e2f03b1","artifact":"preflight-68bbf534cd2c09ea"}]}
      # Generated with zig build plan -- --tier release.
      release-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"test (ubuntu-latest, Debug)","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"4ef6f71394fc7b54","artifact":""},{"os":"ubuntu-latest","name":"test (ubuntu-latest, ReleaseSafe)","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"b1ef680b3cf751fc","artifact":""},{"os":"ubuntu-latest","name":"test (ubuntu-latest, ReleaseFast)","step":"ci","args":"-Doptimize=ReleaseFast -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"78112c0bbd06b163","artifact":""},{"os":"ubuntu-latest","name":"source checks and documented snippets","step":"lint","args":"","shard":"","setup":false,"job_timeout":20,"cache_key":"f8fb09ced14d6cbf","artifact":""},{"os":"ubuntu-latest","name":"compile (ReleaseSmall)","step":"check","args":"-Doptimize=ReleaseSmall","shard":"","setup":false,"job_timeout":20,"cache_key":"6c50ab4fb2b6cda5","artifact":""},{"os":"ubuntu-latest","name":"cross (all configured targets)","step":"preflight-cross","args":"","shard":"","setup":false,"job_timeout":20,"cache_key":"31829ac6da603806","artifact":""}]}
      release-compile-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"compile for test (macos-latest, Debug)","step":"ci-build","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true -Dtarget=aarch64-macos","shard":"","setup":false,"job_timeout":20,"cache_key":"compile-6313ab52f19777ed","artifact":"preflight-6313ab52f19777ed"},{"os":"ubuntu-latest","name":"compile for test (macos-latest, ReleaseSafe)","step":"ci-build","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true -Dtarget=aarch64-macos","shard":"","setup":false,"job_timeout":20,"cache_key":"compile-fc2cf325f2f2b45f","artifact":"preflight-fc2cf325f2f2b45f"},{"os":"ubuntu-latest","name":"compile for test (windows-latest, Debug)","step":"ci-build","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true -Dtarget=x86_64-windows-gnu","shard":"","setup":false,"job_timeout":20,"cache_key":"compile-68bbf534cd2c09ea","artifact":"preflight-68bbf534cd2c09ea"},{"os":"ubuntu-latest","name":"compile for test (windows-latest, ReleaseSafe)","step":"ci-build","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true -Dtarget=x86_64-windows-gnu","shard":"","setup":false,"job_timeout":20,"cache_key":"compile-1e57a6a5744ac376","artifact":"preflight-1e57a6a5744ac376"}]}
      release-run-matrix: >-
        {"include":[{"os":"macos-latest","name":"test (macos-latest, Debug)","step":"ci-run","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"6313ab52f19777ed","artifact":"preflight-6313ab52f19777ed"},{"os":"macos-latest","name":"test (macos-latest, ReleaseSafe)","step":"ci-run","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"fc2cf325f2f2b45f","artifact":"preflight-fc2cf325f2f2b45f"},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 1/2","step":"ci-run","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"1/2","setup":true,"job_timeout":20,"cache_key":"89ffbffa950da5d3","artifact":"preflight-68bbf534cd2c09ea"},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 2/2","step":"ci-run","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"2/2","setup":true,"job_timeout":20,"cache_key":"df84cd491e2f03b1","artifact":"preflight-68bbf534cd2c09ea"},{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe) shard 1/2","step":"ci-run","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"1/2","setup":true,"job_timeout":20,"cache_key":"edd249fd61804909","artifact":"preflight-1e57a6a5744ac376"},{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe) shard 2/2","step":"ci-run","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"2/2","setup":true,"job_timeout":20,"cache_key":"2b595ea5d1212b11","artifact":"preflight-1e57a6a5744ac376"}]}
      windows-git-latest: true
      compile-once: true
  checks:
    needs: skip
    if: needs.skip.outputs.docs-only != 'true' && github.event_name != 'push' && !inputs.status-only && (github.event_name != 'workflow_dispatch' || inputs.tier != 'fast')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build verify
