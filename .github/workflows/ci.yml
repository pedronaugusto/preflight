# Generated by preflight from sample/ci/workflow.json: bay generate -- --self --config sample/ci/workflow.json --working-directory sample
name: CI
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: fast, merge (the gate a change passes to reach main) or release (the full matrix, nightly and before a cut)
        type: choice
        options: [fast, merge, release]
        default: fast
      status-only:
        description: Verify the recorded merge or release tier for this exact commit
        type: boolean
        default: false
  pull_request:
  merge_group:
concurrency:
  # One queue per pull request, per dispatched branch and per main status run; a newer
  # run replaces an older one of the same pull request or work branch, never main's.
  group: ci-${{ github.event_name == 'push' && format('main-status-{0}', github.run_id) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  actions: read
jobs:
  gate:
    uses: ./.github/workflows/zig.yml
    with:
      tier: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || github.event_name == 'schedule' && 'release' || 'merge' }}
      working-directory: "sample"
