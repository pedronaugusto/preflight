name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full merge gate
        type: boolean
        default: false
      status-only:
        description: Verify the recorded full gate for this exact commit
        type: boolean
        default: false
  pull_request:
  merge_group:
concurrency:
  # Main status runs must not share the replaceable branch queue.
  group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-status-{0}', github.run_id) || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  actions: read
jobs:
  skip:
    if: github.event_name != 'push' && !inputs.status-only
    uses: ./.github/workflows/skip.yml
    with:
      full: ${{ github.event_name != 'workflow_dispatch' || inputs.full }}
      preflight-ref: ${{ github.sha }}
      working-directory: sample
  sample:
    needs: skip
    if: always() && (github.event_name == 'push' || inputs.status-only || (needs.skip.result == 'success' && needs.skip.outputs.docs-only != 'true'))
    uses: ./.github/workflows/zig.yml
    with:
      full: ${{ github.event_name != 'workflow_dispatch' || inputs.full }}
      working-directory: sample
      preflight-ref: ${{ github.sha }}
      attest: ${{ github.event_name == 'push' || inputs.status-only }}
      # Generated from ci/workflow.json with zig build plan -- --full false.
      fast-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"Linux Debug","step":"preflight-fast","args":"-Doptimize=Debug","shard":"","timeout":"","setup":true,"job_timeout":20,"cache_key":"fast-linux-debug-0","artifact":""}]}
      # Generated from ci/workflow.json with zig build plan -- --full true.
      full-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"test (ubuntu-latest, Debug)","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"","timeout":"","setup":true,"job_timeout":20,"cache_key":"9fbf30b0678dbb3b","artifact":""},{"os":"ubuntu-latest","name":"test (ubuntu-latest, ReleaseSafe)","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"","timeout":"","setup":true,"job_timeout":20,"cache_key":"f3f7412fc22f7ef2","artifact":""},{"os":"ubuntu-latest","name":"test (ubuntu-latest, ReleaseFast)","step":"ci","args":"-Doptimize=ReleaseFast -Dci-lint=false -Dci-timings=true","shard":"","timeout":"","setup":true,"job_timeout":20,"cache_key":"7d99932be40e326c","artifact":""},{"os":"ubuntu-latest","name":"source checks and documented snippets","step":"lint","args":"","shard":"","timeout":"","setup":false,"job_timeout":20,"cache_key":"119e3d2ddf82d539","artifact":""},{"os":"ubuntu-latest","name":"compile (ReleaseSmall)","step":"check","args":"-Doptimize=ReleaseSmall","shard":"","timeout":"","setup":false,"job_timeout":20,"cache_key":"4515d8efc7af7d51","artifact":""},{"os":"ubuntu-latest","name":"cross (all configured targets)","step":"preflight-cross","args":"","shard":"","timeout":"","setup":false,"job_timeout":20,"cache_key":"1b13795de3f7fdd5","artifact":""}]}
      compile-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"compile for test (macos-latest, Debug)","step":"ci-build","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true -Dtarget=aarch64-macos","shard":"","timeout":"","setup":false,"job_timeout":20,"cache_key":"compile-55bdb664308335e9","artifact":"preflight-55bdb664308335e9"},{"os":"ubuntu-latest","name":"compile for test (macos-latest, ReleaseSafe)","step":"ci-build","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true -Dtarget=aarch64-macos","shard":"","timeout":"","setup":false,"job_timeout":20,"cache_key":"compile-27cddf12008ccc5a","artifact":"preflight-27cddf12008ccc5a"},{"os":"ubuntu-latest","name":"compile for test (windows-latest, Debug)","step":"ci-build","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true -Dtarget=x86_64-windows-gnu","shard":"","timeout":"","setup":false,"job_timeout":20,"cache_key":"compile-25461c254a40e6ac","artifact":"preflight-25461c254a40e6ac"},{"os":"ubuntu-latest","name":"compile for test (windows-latest, ReleaseSafe)","step":"ci-build","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true -Dtarget=x86_64-windows-gnu","shard":"","timeout":"","setup":false,"job_timeout":20,"cache_key":"compile-28db6192c999c644","artifact":"preflight-28db6192c999c644"}]}
      run-matrix: >-
        {"include":[{"os":"macos-latest","name":"test (macos-latest, Debug)","step":"ci-run","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"","timeout":"","setup":true,"job_timeout":20,"cache_key":"55bdb664308335e9","artifact":"preflight-55bdb664308335e9"},{"os":"macos-latest","name":"test (macos-latest, ReleaseSafe)","step":"ci-run","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"","timeout":"","setup":true,"job_timeout":20,"cache_key":"27cddf12008ccc5a","artifact":"preflight-27cddf12008ccc5a"},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 1/2","step":"ci-run","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"1/2","timeout":"","setup":true,"job_timeout":20,"cache_key":"23888246a8081fe6","artifact":"preflight-25461c254a40e6ac"},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 2/2","step":"ci-run","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"2/2","timeout":"","setup":true,"job_timeout":20,"cache_key":"edd46e6bc1cef8d8","artifact":"preflight-25461c254a40e6ac"},{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe) shard 1/2","step":"ci-run","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"1/2","timeout":"","setup":true,"job_timeout":20,"cache_key":"e902e74a474a07b2","artifact":"preflight-28db6192c999c644"},{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe) shard 2/2","step":"ci-run","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"2/2","timeout":"","setup":true,"job_timeout":20,"cache_key":"a4fc0731b45ab05c","artifact":"preflight-28db6192c999c644"}]}
      windows-git-latest: true
      compile-once: true
  checks:
    needs: skip
    if: needs.skip.outputs.docs-only != 'true' && github.event_name != 'push' && !inputs.status-only && (github.event_name != 'workflow_dispatch' || inputs.full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build verify
