name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full merge gate
        type: boolean
        default: false
      status-only:
        description: Verify the recorded full gate for this exact commit
        type: boolean
        default: false
  pull_request:
  merge_group:
  schedule:
    - cron: '17 4 * * 1'
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  actions: read
jobs:
  sample:
    uses: ./.github/workflows/zig.yml
    with:
      full: ${{ github.event_name != 'workflow_dispatch' || inputs.full }}
      working-directory: sample
      preflight-ref: ${{ github.sha }}
      attest: ${{ github.event_name == 'push' || inputs.status-only }}
  checks:
    if: github.event_name != 'push' && !inputs.status-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build verify
