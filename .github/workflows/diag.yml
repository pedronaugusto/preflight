name: Diag
on:
  push:
    branches: [ci-time-diag]
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/sweep
          ref: ci-time-after
          path: sweep
      - name: Sweep, cold, then with only the package cache cold
        shell: bash
        run: |
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zig-global" ZIG_LOCAL_CACHE_DIR="$GITHUB_WORKSPACE/.zig-cache"
          cd sweep
          date +%T; time zig build --list-steps > /dev/null 2> "$RUNNER_TEMP/first.txt"; date +%T
          grep -c . "$RUNNER_TEMP/first.txt"; grep "info:" "$RUNNER_TEMP/first.txt" | head
          rm -rf "$ZIG_GLOBAL_CACHE_DIR/p" "$ZIG_LOCAL_CACHE_DIR"
          date +%T; time zig build --list-steps > /dev/null 2>&1; date +%T
          rm -rf "$ZIG_LOCAL_CACHE_DIR"
          date +%T; time zig build --list-steps > /dev/null 2>&1; date +%T
          du -sh "$ZIG_GLOBAL_CACHE_DIR"/* "$ZIG_LOCAL_CACHE_DIR"/* | sort -h | tail
