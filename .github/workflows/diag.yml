name: Diag
on:
  push:
    branches: [ci-time-diag]
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/sweep
          ref: ci-time-after
          path: sweep
      - name: Take the prebuilt checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/pedronaugusto/preflight/actions/artifacts?name=toolchain-9b813323207ea78e607a5fc8ad49dd30ae62978a" --jq '.artifacts[0].id')
          gh api "repos/pedronaugusto/preflight/actions/artifacts/$id/zip" > "$RUNNER_TEMP/t.zip"
          mkdir -p "$RUNNER_TEMP/bin" && unzip -q "$RUNNER_TEMP/t.zip" -d "$RUNNER_TEMP/bin" && chmod +x "$RUNNER_TEMP/bin/linux/preflight"
      - name: Plain zig, then preflight fetch, on one warm global cache
        shell: bash
        run: |
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zig-global" ZIG_LOCAL_CACHE_DIR="$GITHUB_WORKSPACE/.zig-cache" BUILD_ARGS="-Doptimize=debug -Dci-lint=false"
          cd sweep
          date +%T; time zig build --list-steps > /dev/null 2>&1; date +%T
          rm -rf "$ZIG_LOCAL_CACHE_DIR" "$ZIG_GLOBAL_CACHE_DIR/p"
          date +%T; time "$RUNNER_TEMP/bin/linux/preflight" fetch > /dev/null 2>&1; date +%T
          rm -rf "$ZIG_LOCAL_CACHE_DIR"
          date +%T; time "$RUNNER_TEMP/bin/linux/preflight" fetch > /dev/null 2>&1; date +%T
