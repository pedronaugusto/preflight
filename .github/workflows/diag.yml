name: Diag
on:
  workflow_dispatch:
jobs:
  diag:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false
      - name: Cold, then warm global with a cold local
        shell: bash
        run: |
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zig-global" ZIG_LOCAL_CACHE_DIR="$RUNNER_TEMP/zig-local"
          mkdir -p "$RUNNER_TEMP/triv" && cd "$RUNNER_TEMP/triv"
          printf 'const std = @import("std");\npub fn build(b: *std.Build) void {\n    _ = b.step("t", "t");\n}\n' > build.zig
          date +%T; time zig build --list-steps > /dev/null
          du -sh "$ZIG_GLOBAL_CACHE_DIR"/* "$ZIG_LOCAL_CACHE_DIR"/* | sort -h | tail -8
          rm -rf "$ZIG_LOCAL_CACHE_DIR"
          date +%T; time zig build --list-steps > /dev/null
          date +%T
