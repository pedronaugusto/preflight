name: Diag
on:
  push:
    branches: [ci-time-diag]
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false
      - name: Build the runner
        shell: bash
        run: |
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zig-global" ZIG_LOCAL_CACHE_DIR="$RUNNER_TEMP/zig-local"
          mkdir -p "$RUNNER_TEMP/triv" && cd "$RUNNER_TEMP/triv"
          printf 'const std = @import("std");\npub fn build(b: *std.Build) void {\n    _ = b.step("t", "t");\n}\n' > build.zig
          grep -m1 "model name" /proc/cpuinfo
          time zig build --list-steps > /dev/null
      - uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/zig-global/o
            ${{ runner.temp }}/zig-global/h
            ${{ runner.temp }}/zig-global/z
            ${{ runner.temp }}/zig-global/b
          key: diag-${{ github.run_id }}
  b:
    needs: a
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    steps:
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          use-cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/zig-global/o
            ${{ runner.temp }}/zig-global/h
            ${{ runner.temp }}/zig-global/z
            ${{ runner.temp }}/zig-global/b
          key: diag-${{ github.run_id }}
      - name: Use it
        shell: bash
        run: |
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zig-global" ZIG_LOCAL_CACHE_DIR="$RUNNER_TEMP/zig-local"
          mkdir -p "$RUNNER_TEMP/triv" && cd "$RUNNER_TEMP/triv"
          printf 'const std = @import("std");\npub fn build(b: *std.Build) void {\n    _ = b.step("t", "t");\n}\n' > build.zig
          grep -m1 "model name" /proc/cpuinfo
          time zig build --list-steps > /dev/null
