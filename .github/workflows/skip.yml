name: Documentation filter
on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
      preflight-ref:
        type: string
        required: true
      working-directory:
        type: string
        default: .
    outputs:
      docs-only:
        value: ${{ jobs.skip.outputs.docs-only }}
permissions:
  contents: read
jobs:
  skip:
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.paths.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Filter paths and check documentation when it is the only change
        id: paths
        env:
          PREFLIGHT_FULL: ${{ inputs.full }}
          PREFLIGHT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}" skip -- --config "${{ inputs.working-directory }}/ci/preflight.json"
