name: Zig
on:
  workflow_call:
    inputs:
      tier:
        description: ci (every push, to main and to a land/ branch, and pull request), release (the ci tier and the release modes, by dispatch on a release's head), nightly (the heavy legs) or fuzz (the fuzz job alone, by dispatch)
        type: string
        default: ci
      working-directory:
        type: string
        default: .
      preflight-ref:
        type: string
        required: true
      ci-matrix:
        description: Static ci-tier matrix, zig build plan -- --tier ci
        type: string
        default: '{"include":[]}'
      release-matrix:
        description: Static release-tier matrix, zig build plan -- --tier release
        type: string
        default: '{"include":[]}'
      nightly-matrix:
        description: Static nightly-tier matrix, zig build plan -- --tier nightly
        type: string
        default: '{"include":[]}'
      fuzz-matrix:
        description: The fuzz job, zig build plan -- --tier fuzz; empty for a package with nothing to fuzz
        type: string
        default: '{"include":[]}'
      ci-runners:
        description: The runners the ci tier's jobs take the toolchain for, a JSON list, as the planner lists them beside its matrix
        type: string
        default: '["linux","linux-arm","macos","windows","windows-arm"]'
      release-runners:
        description: The runners the release tier's jobs take the toolchain for, a JSON list, as the planner lists them beside its matrix
        type: string
        default: '["linux","linux-arm","macos","windows","windows-arm"]'
      nightly-runners:
        description: The runners the nightly tier's jobs take the toolchain for, a JSON list, as the planner lists them beside its matrix
        type: string
        default: '["linux","linux-arm","macos","windows","windows-arm"]'
      fuzz-runners:
        description: The runners the fuzz tier's jobs take the toolchain for, a JSON list, as the planner lists them beside its matrix
        type: string
        default: '["linux","linux-arm","macos","windows","windows-arm"]'
      fuzz-minutes:
        description: A dispatched fuzz run's minutes, when not ci/workflow.json's fuzz_minutes
        type: string
        default: ''
      held-git:
        description: The package's held git (`git` in ci/workflow.json), by its release and its tarball's hash, which names its build's cache; empty for none
        type: string
        default: ''
# Each job names its own token's permissions, every one read-only.
permissions: {}
jobs:
  tier:
    if: >-
      !contains(fromJSON('["ci","release","nightly","fuzz"]'), inputs.tier) || inputs.tier == 'fuzz' && inputs.fuzz-matrix == '{"include":[]}'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          TIER: ${{ inputs.tier }}
        run: |
          if [ "$TIER" = fuzz ]; then echo "fuzz: this package has no fuzz job: it declares no shakedown, or ci/workflow.json's fuzz_minutes is 0"; exit 1; fi
          echo "tier must be ci, release, nightly or fuzz, not '$TIER'" && exit 1
  # The checks are built once per runner, and every job takes its runner's: no
  # job compiles the toolchain. `pinned` then tells a dispatched ci run whether its
  # branch changes documentation alone, which needs none of the gate.
  toolchain:
    if: contains(fromJSON('["ci","release","nightly","fuzz"]'), inputs.tier)
    name: toolchain (${{ matrix.runner }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # One job per runner the tier's jobs run on, and Linux, where the run's own jobs run: the
    # planner lists them beside each tier's matrix. The run waits for the slowest build, not
    # their sum, and the ci tier builds no ARM toolchain.
    strategy:
      matrix:
        runner: ${{ fromJSON(inputs.tier == 'release' && inputs.release-runners || inputs.tier == 'nightly' && inputs.nightly-runners || inputs.tier == 'fuzz' && inputs.fuzz-runners || inputs.ci-runners) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/toolchain
        with:
          preflight-ref: ${{ inputs.preflight-ref }}
          runner: ${{ matrix.runner }}
      # preflight keeps its own run's toolchain ninety days, one artifact per runner, for the
      # callers pinned to its commit; a caller's run keeps it for the run.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toolchain-${{ inputs.preflight-ref }}-${{ matrix.runner }}
          path: .preflight-bin
          include-hidden-files: true
          retention-days: ${{ github.repository == 'pedronaugusto/preflight' && 90 || 1 }}
          overwrite: true
  # What the run checks before its gate, with the Linux toolchain: the pin, and for a
  # dispatched ci run whether only documentation changed. A job apart from the toolchain's,
  # since a matrix job's outputs are whichever leg wrote last.
  pinned:
    needs: toolchain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs-only: ${{ steps.paths.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: toolchain-${{ inputs.preflight-ref }}-linux
          path: .preflight-bin
      - name: Allow the checks to run
        run: chmod +x .preflight-bin/linux/*
      # The run checks the package with the preflight its manifest pins: a caller not made
      # again at a re-pin would run an older preflight than the build calls.
      - name: Check the package pins the preflight this caller runs
        working-directory: ${{ inputs.working-directory }}
        run: $GITHUB_WORKSPACE/.preflight-bin/linux/preflight pin --ref ${{ inputs.preflight-ref }}
      # A documentation generator may run zig.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: github.event_name == 'workflow_dispatch' && inputs.tier == 'ci'
        with:
          version: 0.17.0
          use-cache: false
      # A dispatched ci run compares its branch with main; a push, a pull request, a release and a nightly run keep the whole gate.
      - name: Filter paths and check documentation when it is the only change
        id: paths
        if: github.event_name == 'workflow_dispatch' && inputs.tier == 'ci'
        working-directory: ${{ inputs.working-directory }}
        env:
          PREFLIGHT_TIER: ${{ inputs.tier }}
        run: $GITHUB_WORKSPACE/.preflight-bin/linux/preflight skip
  gate:
    needs: [toolchain, pinned]
    if: needs.pinned.outputs.docs-only != 'true' && contains(fromJSON('["ci","release","nightly","fuzz"]'), inputs.tier)
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # A dispatched fuzz run's minutes are its own, which the plan never saw: its job has
    # GitHub's whole limit, and the budget (at most 330 minutes) ends it first.
    timeout-minutes: ${{ inputs.tier == 'fuzz' && inputs.fuzz-minutes != '' && 360 || matrix.job_timeout }}
    # A declared job marked advisory runs and shows its result without taking the run's, as
    # Zig master's does, by the same means: a job-level continue-on-error still concludes a
    # called workflow's run "failure", so each step that can fail continues where the job is
    # advisory, a step needing an earlier one runs only where it passed, and the report names
    # each outcome. Its run step has the plan's `run_timeout`, and its job that and the other
    # steps' budgets (`matrix.zig`'s advisory_overhead_minutes), so no advisory job meets its bound.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.tier == 'release' && inputs.release-matrix || inputs.tier == 'nightly' && inputs.nightly-matrix || inputs.tier == 'fuzz' && inputs.fuzz-matrix || inputs.ci-matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        id: package
        timeout-minutes: 5
        continue-on-error: ${{ matrix.advisory == true }}
        with:
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        id: preflight
        timeout-minutes: 5
        continue-on-error: ${{ matrix.advisory == true }}
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
        id: setup
        if: steps.package.outcome == 'success' && steps.preflight.outcome == 'success'
        timeout-minutes: 30
        continue-on-error: ${{ matrix.advisory == true }}
        with:
          working-directory: ${{ matrix.directory || inputs.working-directory }}
          build-args: ${{ matrix.args }}
          build-key: ${{ matrix.step }}
          # Its runner's toolchain alone, which the planner names in its matrix entry.
          toolchain: toolchain-${{ inputs.preflight-ref }}-${{ matrix.toolchain }}
      # riscv64 Linux runs on its own kernel under QEMU's system emulation (`-Dci-vm`). Ubuntu 26.04
      # ships qemu-system-riscv64 in a package of its own; 24.04 has it in qemu-system-misc.
      # apt's own deadlines end a stalled download and retry it; the step's is a backstop with
      # room for a slow mirror, where 5 minutes ended an install as apt finished it.
      - name: Install QEMU's riscv64 system emulation
        id: riscv64
        if: matrix.machine == 'riscv64' && steps.setup.outcome == 'success'
        timeout-minutes: 15
        continue-on-error: ${{ matrix.advisory == true }}
        run: |
          apt='-q -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60'
          sudo apt-get $apt update
          package=qemu-system-misc
          if apt-cache show qemu-system-riscv > /dev/null 2>&1; then package=qemu-system-riscv; fi
          sudo apt-get $apt install -y --no-install-recommends "$package"
          command -v qemu-system-riscv64
      # x86_64 FreeBSD runs on its own kernel under KVM (`-Dci-vm`): QEMU's x86_64 system
      # emulation, and the runner's /dev/kvm opened to the job's user.
      - name: Install QEMU's x86_64 system emulation and open KVM
        id: kvm
        if: matrix.machine == 'freebsd' && steps.setup.outcome == 'success'
        timeout-minutes: 15
        continue-on-error: ${{ matrix.advisory == true }}
        run: |
          apt='-q -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60'
          sudo apt-get $apt update
          sudo apt-get $apt install -y --no-install-recommends qemu-system-x86
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          command -v qemu-system-x86_64
      # The package's held git: its build, kept from run to run by its release, preflight's
      # recipe and the machine (the riscv64 machine's own builds in its tests' step).
      - name: Restore the held git
        id: held_git
        if: matrix.setup && inputs.held-git != '' && steps.setup.outcome == 'success'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        timeout-minutes: 2
        continue-on-error: ${{ matrix.advisory == true }}
        with:
          path: ${{ runner.temp }}/preflight-git
          key: preflight-git-${{ inputs.held-git }}-r3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.machine }}
      # Its own step, once: a build's deadline, where each tools attempt is a setup's.
      - name: Hold the package's git
        id: hold
        if: matrix.setup && inputs.held-git != '' && steps.setup.outcome == 'success'
        timeout-minutes: 30
        continue-on-error: ${{ matrix.advisory == true }}
        working-directory: ${{ matrix.directory || inputs.working-directory }}
        run: preflight prepare --held-git
      # On a tools-cache miss the setup step builds the tools, cold: the first attempt has a
      # build's deadline then, and a setup's when they came from the cache.
      - name: Set up test tools (attempt 1/3)
        id: tools1
        if: matrix.setup && steps.setup.outcome == 'success' && steps.hold.outcome != 'failure'
        timeout-minutes: ${{ steps.setup.outputs.tools-hit == 'true' && 5 || 30 }}
        continue-on-error: true
        working-directory: ${{ matrix.directory || inputs.working-directory }}
        env:
          PREFLIGHT_SETUP_STEP: ${{ matrix.prepare }}
        run: preflight prepare
      - name: Set up test tools (attempt 2/3)
        id: tools2
        if: ${{ !cancelled() && steps.tools1.outcome == 'failure' }}
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ${{ matrix.directory || inputs.working-directory }}
        env:
          PREFLIGHT_SETUP_STEP: ${{ matrix.prepare }}
        run: preflight prepare
      - name: Set up test tools (attempt 3/3)
        id: tools3
        if: ${{ !cancelled() && steps.tools2.outcome == 'failure' }}
        timeout-minutes: 5
        continue-on-error: ${{ matrix.advisory == true }}
        working-directory: ${{ matrix.directory || inputs.working-directory }}
        env:
          PREFLIGHT_SETUP_STEP: ${{ matrix.prepare }}
        run: preflight prepare
      # The fuzz job's corpora, from the last run that saved them: each run starts where the
      # last one left the fuzzer, and saves what it adds.
      - name: Restore the fuzz corpora
        if: matrix.step == 'ci-fuzz' && steps.setup.outcome == 'success'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        timeout-minutes: 5
        continue-on-error: ${{ matrix.advisory == true }}
        with:
          path: ${{ matrix.directory || inputs.working-directory }}/.zig-cache/preflight-fuzz/*/cache/f
          key: preflight-fuzz-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            preflight-fuzz-${{ runner.os }}-
      - name: Run the gate
        id: suite
        if: steps.setup.outcome == 'success' && steps.hold.outcome != 'failure' && steps.riscv64.outcome != 'failure' && steps.kvm.outcome != 'failure' && (!matrix.setup || steps.tools1.outcome == 'success' || steps.tools2.outcome == 'success' || steps.tools3.outcome == 'success')
        timeout-minutes: ${{ matrix.run_timeout || 360 }}
        continue-on-error: ${{ matrix.advisory == true }}
        working-directory: ${{ matrix.directory || inputs.working-directory }}
        env:
          STEP: ${{ matrix.step }}
          BUILD_ARGS: ${{ matrix.args }}
          PREFLIGHT_SHARD: ${{ matrix.shard }}
          PREFLIGHT_PREPARED: 'true'
          PREFLIGHT_SETUP: ${{ matrix.setup }}
          PREFLIGHT_TARGETS: ${{ matrix.targets }}
          PREFLIGHT_JOB: ${{ matrix.cache_key }}
          # With the job's start, its deadline: a test running then ends named.
          PREFLIGHT_JOB_TIMEOUT: ${{ inputs.tier == 'fuzz' && inputs.fuzz-minutes != '' && 360 || matrix.job_timeout }}
          PREFLIGHT_SETUP_STEP: ${{ matrix.prepare }}
          PREFLIGHT_FUZZ_MINUTES: ${{ inputs.tier == 'fuzz' && inputs.fuzz-minutes || '' }}
        run: preflight run
      - name: Save the held git
        if: always() && matrix.setup && inputs.held-git != '' && steps.held_git.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        timeout-minutes: 2
        continue-on-error: ${{ matrix.advisory == true }}
        with:
          path: ${{ runner.temp }}/preflight-git
          key: preflight-git-${{ inputs.held-git }}-r3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.machine }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.step == 'hardened-fuzz'
        timeout-minutes: 5
        continue-on-error: ${{ matrix.advisory == true }}
        with:
          name: fuzz-${{ inputs.tier }}-${{ matrix.cache_key }}
          path: ${{ env.ZIG_LOCAL_CACHE_DIR }}/v
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Save the fuzz corpora
        if: always() && matrix.step == 'ci-fuzz'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        timeout-minutes: 5
        continue-on-error: ${{ matrix.advisory == true }}
        with:
          path: ${{ matrix.directory || inputs.working-directory }}/.zig-cache/preflight-fuzz/*/cache/f
          key: preflight-fuzz-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      # What the fuzz job found, each finding's tape and the shrunk one, and the corpora,
      # an input that crashed the fuzzer among them (f/crash).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.step == 'ci-fuzz'
        timeout-minutes: 5
        continue-on-error: ${{ matrix.advisory == true }}
        with:
          name: fuzz-findings-${{ inputs.tier }}-${{ github.run_attempt }}
          path: |
            ${{ matrix.directory || inputs.working-directory }}/.zig-cache/preflight-fuzz/*/findings
            ${{ matrix.directory || inputs.working-directory }}/.zig-cache/preflight-fuzz/*/cache/f
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      # A FreeBSD machine that ended without its program's ending keeps its run, console among it.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && matrix.machine == 'freebsd'
        timeout-minutes: 5
        continue-on-error: ${{ matrix.advisory == true }}
        with:
          name: freebsd-runs-${{ matrix.cache_key }}
          path: ${{ matrix.directory || inputs.working-directory }}/.zig-cache/tmp/preflight-vm-*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Report
        uses: ./.preflight/.github/actions/advisory-report
        if: always() && matrix.advisory == true
        timeout-minutes: 1
        continue-on-error: true
        with:
          title: ${{ matrix.name }}
          outcome: ${{ steps.suite.outcome }}
          steps: setup ${{ steps.setup.outcome || 'not run' }}, tool setup ${{ steps.tools1.outcome == 'success' && 'success' || steps.tools2.outcome == 'success' && 'success' || steps.tools3.outcome || steps.tools1.outcome || 'not run' }}
  master:
    # Zig master (the next release in development) never blocks: its result is
    # read at each merge, and a break is a note for the next port's codemod table.
    # It builds its own checks, since they must be built by the Zig they read.
    # bay comes from the toolchain, as for every other job: it only runs
    # `zig build`, and `ZIG`, which the setup sets to the Zig it installed, makes
    # that Zig master for a package bay develops.
    needs: toolchain
    if: inputs.tier == 'nightly'
    name: Zig master (Linux Debug, non-blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # An advisory job never fails: a job-level continue-on-error still concludes a called
    # workflow's run "failure" (ensign's 45437116488, red on this job alone), and a release
    # needs the nightly run's "success". So every step that can fail continues, each step that needs
    # an earlier one runs only where it passed, and the report names each outcome in the
    # summary and as a warning. All step budgets total 102 minutes, 132 with the held git's
    # build; a stalled step ends before this bound, which would cancel the job.
    timeout-minutes: ${{ inputs.held-git != '' && 135 || 105 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        id: package
        timeout-minutes: 2
        continue-on-error: true
        with:
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        id: preflight
        timeout-minutes: 2
        continue-on-error: true
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      # bay is on the path before the setup, whose fetch configures the
      # package's build: `bay dev` for a package bay develops.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: toolchain
        timeout-minutes: 2
        continue-on-error: true
        with:
          name: toolchain-${{ inputs.preflight-ref }}-linux
          path: ${{ runner.temp }}/toolchain
      - name: Take bay from the toolchain, building with Zig master
        id: bay
        if: steps.toolchain.outcome == 'success'
        timeout-minutes: 1
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/bay-bin"
          cp "$RUNNER_TEMP/toolchain/linux/bay" "$RUNNER_TEMP/bay-bin/bay"
          chmod +x "$RUNNER_TEMP/bay-bin/bay"
          echo "$RUNNER_TEMP/bay-bin" >> "$GITHUB_PATH"
      # A build's deadline: with Zig master's products cache cold, the setup compiles
      # preflight's checks with that Zig.
      - uses: ./.preflight/.github/actions/setup
        id: setup
        if: steps.package.outcome == 'success' && steps.preflight.outcome == 'success' && steps.bay.outcome == 'success'
        timeout-minutes: 30
        continue-on-error: true
        with:
          zig-version: master
          build-args: -Doptimize=debug -Dci-lint=false
          working-directory: ${{ inputs.working-directory }}
          build-key: master-linux-debug
      # The package's held git: its build, kept from run to run by its release, preflight's
      # recipe and the machine (the riscv64 machine's own builds in its tests' step).
      - name: Restore the held git
        id: held_git
        if: inputs.held-git != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/preflight-git
          key: preflight-git-${{ inputs.held-git }}-r3-${{ runner.os }}-${{ runner.arch }}-none
      # Its own step, once: a build's deadline, where each tools attempt is a setup's.
      - name: Hold the package's git
        id: hold
        if: inputs.held-git != '' && steps.setup.outcome == 'success'
        timeout-minutes: 30
        continue-on-error: true
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare -- --held-git
      - name: Set up test tools (attempt 1/3)
        id: tools1
        if: steps.setup.outcome == 'success'
        timeout-minutes: ${{ steps.setup.outputs.tools-hit == 'true' && 5 || 30 }}
        continue-on-error: true
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Set up test tools (attempt 2/3)
        id: tools2
        if: ${{ !cancelled() && steps.tools1.outcome == 'failure' }}
        timeout-minutes: 5
        continue-on-error: true
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Set up test tools (attempt 3/3)
        id: tools3
        if: ${{ !cancelled() && steps.tools2.outcome == 'failure' }}
        timeout-minutes: 5
        continue-on-error: true
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Run the Debug suite on Zig master
        id: suite
        if: steps.tools1.outcome == 'success' || steps.tools2.outcome == 'success' || steps.tools3.outcome == 'success'
        timeout-minutes: 20
        continue-on-error: true
        env:
          STEP: ci
          BUILD_ARGS: -Doptimize=debug -Dci-lint=false
          PREFLIGHT_PREPARED: 'true'
          PREFLIGHT_SETUP: 'true'
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" run
      - name: Save the held git
        if: always() && inputs.held-git != '' && steps.held_git.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/preflight-git
          key: preflight-git-${{ inputs.held-git }}-r3-${{ runner.os }}-${{ runner.arch }}-none
      # Each outcome is the step's own: `failure` where it failed, `skipped` where what it
      # needs did not pass, empty where it never ran. The report is every non-blocking job's;
      # without preflight's checkout it cannot run, nor can any blocking job, whose red shows.
      - name: Report
        uses: ./.preflight/.github/actions/advisory-report
        timeout-minutes: 1
        if: always()
        continue-on-error: true
        with:
          title: Zig master
          outcome: ${{ steps.suite.outcome }}
          steps: setup ${{ steps.setup.outcome || 'not run' }}, tool setup ${{ steps.tools1.outcome == 'success' && 'success' || steps.tools2.outcome == 'success' && 'success' || steps.tools3.outcome || steps.tools1.outcome || 'not run' }}
          note: a note for the next port
  # A green gate's proof, named for the tier and the exact commit it tested: `bay release`
  # tags a commit only with its release and nightly proofs (`preflight attest`).
  proof:
    needs: [toolchain, gate]
    if: needs.gate.result == 'success' && inputs.tier != 'fuzz'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: echo "$GITHUB_SHA" > proof.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preflight-${{ inputs.tier }}-${{ github.sha }}
          path: proof.txt
          retention-days: 90
  # Last: the jobs GitHub never gave a runner. A job queued until GitHub cancelled it ("not
  # acquired by Runner") ends cancelled with no runner and no step, and a cancelled result is
  # no job's red, and the run could end with a platform's tests never run
  # and nothing failing by name (hull 43891655054, cairn 43896073872, strand 43877949215).
  # This job names each, with its minutes queued, and fails; nothing is retried. It reads the
  # jobs with the token's actions: read.
  runners:
    needs: [toolchain, pinned, gate, proof]
    if: always() && needs.toolchain.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: toolchain-${{ inputs.preflight-ref }}-linux
          path: .preflight-bin
      - name: Every job had a runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          chmod +x .preflight-bin/linux/preflight
          .preflight-bin/linux/preflight runners --jobs "$RUNNER_TEMP/jobs.json"
