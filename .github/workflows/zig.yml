name: Zig
on:
  workflow_call:
    inputs:
      tier:
        description: ci (every push and pull request), release (weekly, by dispatch, and before a tag) or fuzz (the fuzz job alone, by dispatch)
        type: string
        default: ci
      working-directory:
        type: string
        default: .
      preflight-ref:
        type: string
        required: true
      ci-matrix:
        description: Static ci-tier matrix, zig build plan -- --tier ci
        type: string
        default: '{"include":[]}'
      release-matrix:
        description: Static native release-tier matrix, zig build plan -- --tier release
        type: string
        default: '{"include":[]}'
      release-compile-matrix:
        type: string
        default: '{"include":[]}'
      release-run-matrix:
        type: string
        default: '{"include":[]}'
      fuzz-matrix:
        description: The fuzz job, zig build plan -- --tier fuzz; empty for a package with nothing to fuzz
        type: string
        default: '{"include":[]}'
      fuzz-minutes:
        description: A dispatched fuzz run's minutes, when not ci/workflow.json's fuzz_minutes
        type: string
        default: ''
      compile-once:
        type: boolean
        default: false
      held-git:
        description: The package's held git (`git` in ci/workflow.json), by its release and its tarball's hash, which names its build's cache; empty for none
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  tier:
    if: >-
      !contains(fromJSON('["ci","release","fuzz"]'), inputs.tier) || inputs.tier == 'fuzz' && inputs.fuzz-matrix == '{"include":[]}'
    runs-on: ubuntu-latest
    steps:
      - env:
          TIER: ${{ inputs.tier }}
        run: |
          if [ "$TIER" = fuzz ]; then echo "fuzz: this package has no fuzz job: it declares no shakedown, or ci/workflow.json's fuzz_minutes is 0"; exit 1; fi
          echo "tier must be ci, release or fuzz, not '$TIER'" && exit 1
  # The checks are built once, for every runner, and every job takes them: no
  # job compiles the toolchain. The same job tells a dispatched ci run whether its
  # branch changes documentation alone, which needs none of the gate.
  toolchain:
    if: contains(fromJSON('["ci","release","fuzz"]'), inputs.tier)
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.paths.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/toolchain
        with:
          preflight-ref: ${{ inputs.preflight-ref }}
      # preflight keeps its own run's toolchain ninety days, for the callers
      # pinned to its commit; a caller's run keeps it for the run.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: toolchain-${{ inputs.preflight-ref }}
          path: .preflight-bin
          include-hidden-files: true
          retention-days: ${{ github.repository == 'pedronaugusto/preflight' && 90 || 1 }}
          overwrite: true
      # A documentation generator may run zig.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: github.event_name == 'workflow_dispatch' && inputs.tier == 'ci'
        with:
          version: 0.17.0
          use-cache: false
      # A dispatched ci run compares its branch with main; a push to main, a pull request and a release run keep the whole gate.
      - name: Filter paths and check documentation when it is the only change
        id: paths
        if: github.event_name == 'workflow_dispatch' && inputs.tier == 'ci'
        working-directory: ${{ inputs.working-directory }}
        env:
          PREFLIGHT_TIER: ${{ inputs.tier }}
        run: $GITHUB_WORKSPACE/.preflight-bin/linux/preflight skip
  gate:
    needs: toolchain
    if: needs.toolchain.outputs.docs-only != 'true' && contains(fromJSON('["ci","release","fuzz"]'), inputs.tier)
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A dispatched fuzz run's minutes are its own, which the plan never saw: its job has
    # GitHub's whole limit, and the budget (at most 330 minutes) ends it first.
    timeout-minutes: ${{ inputs.tier == 'fuzz' && inputs.fuzz-minutes != '' && 360 || matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.tier == 'release' && inputs.release-matrix || inputs.tier == 'fuzz' && inputs.fuzz-matrix || inputs.ci-matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
        with:
          working-directory: ${{ matrix.directory || inputs.working-directory }}
          build-args: ${{ matrix.args }}
          build-key: ${{ matrix.step }}
          toolchain: toolchain-${{ inputs.preflight-ref }}
      # riscv64 Linux runs on its own kernel under QEMU's system emulation (`-Dci-vm`). Ubuntu 26.04
      # ships qemu-system-riscv64 in a package of its own; 24.04 has it in qemu-system-misc.
      - name: Install QEMU's riscv64 system emulation
        if: matrix.machine == 'riscv64'
        timeout-minutes: 5
        run: |
          sudo apt-get update -q
          package=qemu-system-misc
          if apt-cache show qemu-system-riscv > /dev/null 2>&1; then package=qemu-system-riscv; fi
          sudo apt-get install -y -q --no-install-recommends "$package"
          command -v qemu-system-riscv64
      # x86_64 FreeBSD runs on its own kernel under KVM (`-Dci-vm`): QEMU's x86_64 system
      # emulation, and the runner's /dev/kvm opened to the job's user.
      - name: Install QEMU's x86_64 system emulation and open KVM
        if: matrix.machine == 'freebsd'
        timeout-minutes: 5
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          command -v qemu-system-x86_64
      # The package's held git: its build, kept from run to run by its release, preflight's
      # recipe and the machine (the riscv64 machine's own builds in its tests' step).
      - name: Restore the held git
        id: held_git
        if: matrix.setup && inputs.held-git != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/preflight-git
          key: preflight-git-${{ inputs.held-git }}-r1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.machine }}
      - name: Set up test tools (attempt 1/3)
        id: tools1
        if: matrix.setup
        timeout-minutes: ${{ inputs.held-git != '' && 30 || 5 }}
        continue-on-error: true
        working-directory: ${{ matrix.directory || inputs.working-directory }}
        env:
          PREFLIGHT_HELD_GIT: ${{ inputs.held-git }}
          PREFLIGHT_SETUP_STEP: ${{ matrix.prepare }}
        run: preflight prepare
      - name: Set up test tools (attempt 2/3)
        id: tools2
        if: ${{ !cancelled() && steps.tools1.outcome == 'failure' }}
        timeout-minutes: ${{ inputs.held-git != '' && 30 || 5 }}
        continue-on-error: true
        working-directory: ${{ matrix.directory || inputs.working-directory }}
        env:
          PREFLIGHT_HELD_GIT: ${{ inputs.held-git }}
          PREFLIGHT_SETUP_STEP: ${{ matrix.prepare }}
        run: preflight prepare
      - name: Set up test tools (attempt 3/3)
        id: tools3
        if: ${{ !cancelled() && steps.tools2.outcome == 'failure' }}
        timeout-minutes: ${{ inputs.held-git != '' && 30 || 5 }}
        working-directory: ${{ matrix.directory || inputs.working-directory }}
        env:
          PREFLIGHT_HELD_GIT: ${{ inputs.held-git }}
          PREFLIGHT_SETUP_STEP: ${{ matrix.prepare }}
        run: preflight prepare
      # The fuzz job's corpora, from the last run that saved them: each run starts where the
      # last one left the fuzzer, and saves what it adds.
      - name: Restore the fuzz corpora
        if: matrix.step == 'ci-fuzz'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ matrix.directory || inputs.working-directory }}/.zig-cache/preflight-fuzz/*/cache/f
          key: preflight-fuzz-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            preflight-fuzz-${{ runner.os }}-
      - name: Run the gate
        working-directory: ${{ matrix.directory || inputs.working-directory }}
        env:
          STEP: ${{ matrix.step }}
          BUILD_ARGS: ${{ matrix.args }}
          PREFLIGHT_SHARD: ${{ matrix.shard }}
          PREFLIGHT_PREPARED: 'true'
          PREFLIGHT_SETUP: ${{ matrix.setup }}
          PREFLIGHT_TARGETS: ${{ matrix.targets }}
          PREFLIGHT_JOB: ${{ matrix.cache_key }}
          # With the job's start, its deadline: a test running then ends named.
          PREFLIGHT_JOB_TIMEOUT: ${{ inputs.tier == 'fuzz' && inputs.fuzz-minutes != '' && 360 || matrix.job_timeout }}
          PREFLIGHT_SETUP_STEP: ${{ matrix.prepare }}
          PREFLIGHT_FUZZ_MINUTES: ${{ inputs.tier == 'fuzz' && inputs.fuzz-minutes || '' }}
        run: preflight run
      - name: Save the held git
        if: always() && matrix.setup && inputs.held-git != '' && steps.held_git.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/preflight-git
          key: preflight-git-${{ inputs.held-git }}-r1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.machine }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.step == 'hardened-fuzz'
        with:
          name: fuzz-${{ inputs.tier }}-${{ matrix.cache_key }}
          path: ${{ env.ZIG_LOCAL_CACHE_DIR }}/v
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Save the fuzz corpora
        if: always() && matrix.step == 'ci-fuzz'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ matrix.directory || inputs.working-directory }}/.zig-cache/preflight-fuzz/*/cache/f
          key: preflight-fuzz-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      # What the fuzz job found, each finding's tape and the shrunk one, and the corpora,
      # an input that crashed the fuzzer among them (f/crash).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.step == 'ci-fuzz'
        with:
          name: fuzz-findings-${{ inputs.tier }}-${{ github.run_attempt }}
          path: |
            ${{ matrix.directory || inputs.working-directory }}/.zig-cache/preflight-fuzz/*/findings
            ${{ matrix.directory || inputs.working-directory }}/.zig-cache/preflight-fuzz/*/cache/f
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: timings-${{ matrix.cache_key }}
          path: ${{ matrix.directory || inputs.working-directory }}/.zig-cache/preflight-timings
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      # A FreeBSD machine that ended without its program's ending keeps its run, console among it.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && matrix.machine == 'freebsd'
        with:
          name: freebsd-runs-${{ matrix.cache_key }}
          path: ${{ matrix.directory || inputs.working-directory }}/.zig-cache/tmp/preflight-vm-*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  master:
    # Zig master (the next release in development) never blocks: its result is
    # read at each merge, and a break is a note for the next port's codemod table.
    # It builds its own checks, since they must be built by the Zig they read.
    # bay comes from the toolchain, as for every other job: it only runs
    # `zig build`, and `ZIG`, which the setup sets to the Zig it installed, makes
    # that Zig master for a package bay develops.
    needs: toolchain
    if: inputs.tier == 'release'
    name: Zig master (Linux Debug, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    # All step budgets total 50 minutes; a stalled step fails before this
    # cancellation bound, so continue-on-error can keep the run advisory.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: 2
        with:
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: 2
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      # bay is on the path before the setup, whose fetch configures the
      # package's build: `bay dev` for a package bay develops.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 2
        with:
          name: toolchain-${{ inputs.preflight-ref }}
          path: ${{ runner.temp }}/toolchain
      - name: Take bay from the toolchain, building with Zig master
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/bay-bin"
          cp "$RUNNER_TEMP/toolchain/linux/bay" "$RUNNER_TEMP/bay-bin/bay"
          chmod +x "$RUNNER_TEMP/bay-bin/bay"
          echo "$RUNNER_TEMP/bay-bin" >> "$GITHUB_PATH"
      - uses: ./.preflight/.github/actions/setup
        timeout-minutes: 10
        with:
          zig-version: master
          build-args: -Doptimize=debug -Dci-lint=false
          working-directory: ${{ inputs.working-directory }}
          build-key: master-linux-debug
      # The package's held git: its build, kept from run to run by its release, preflight's
      # recipe and the machine (the riscv64 machine's own builds in its tests' step).
      - name: Restore the held git
        id: held_git
        if: inputs.held-git != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/preflight-git
          key: preflight-git-${{ inputs.held-git }}-r1-${{ runner.os }}-${{ runner.arch }}-none
      - name: Set up test tools (attempt 1/3)
        id: tools1
        timeout-minutes: ${{ inputs.held-git != '' && 30 || 5 }}
        continue-on-error: true
        env:
          PREFLIGHT_HELD_GIT: ${{ inputs.held-git }}
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Set up test tools (attempt 2/3)
        id: tools2
        if: ${{ !cancelled() && steps.tools1.outcome == 'failure' }}
        timeout-minutes: ${{ inputs.held-git != '' && 30 || 5 }}
        continue-on-error: true
        env:
          PREFLIGHT_HELD_GIT: ${{ inputs.held-git }}
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Set up test tools (attempt 3/3)
        id: tools3
        if: ${{ !cancelled() && steps.tools2.outcome == 'failure' }}
        timeout-minutes: ${{ inputs.held-git != '' && 30 || 5 }}
        env:
          PREFLIGHT_HELD_GIT: ${{ inputs.held-git }}
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Run the Debug suite on Zig master
        id: suite
        timeout-minutes: 20
        env:
          STEP: ci
          BUILD_ARGS: -Doptimize=debug -Dci-lint=false
          PREFLIGHT_PREPARED: 'true'
          PREFLIGHT_SETUP: 'true'
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" run
      - name: Save the held git
        if: always() && inputs.held-git != '' && steps.held_git.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/preflight-git
          key: preflight-git-${{ inputs.held-git }}-r1-${{ runner.os }}-${{ runner.arch }}-none
      - name: Report
        timeout-minutes: 1
        if: always()
        env:
          OUTCOME: ${{ steps.suite.outcome }}
          TOOLS: ${{ steps.tools1.outcome == 'success' && 'success' || steps.tools2.outcome == 'success' && 'success' || steps.tools3.outcome }}
        run: |
          version=$(zig version 2>/dev/null || echo unknown)
          echo "Zig master $version: tool setup $TOOLS; suite $OUTCOME (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" != success ]; then echo "::warning title=Zig master::$version: the Debug suite did not pass; a note for the next port"; fi
  compile:
    needs: toolchain
    if: inputs.tier == 'release' && inputs.compile-once
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.release-compile-matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          build-args: ${{ matrix.args }}
          build-key: ${{ matrix.step }}
          toolchain: toolchain-${{ inputs.preflight-ref }}
      - name: Set up test tools (attempt 1/3)
        id: tools1
        if: matrix.setup
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: preflight prepare
      - name: Set up test tools (attempt 2/3)
        id: tools2
        if: ${{ !cancelled() && steps.tools1.outcome == 'failure' }}
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: preflight prepare
      - name: Set up test tools (attempt 3/3)
        id: tools3
        if: ${{ !cancelled() && steps.tools2.outcome == 'failure' }}
        timeout-minutes: 5
        working-directory: ${{ inputs.working-directory }}
        run: preflight prepare
      - name: Link test executables with the native SDK
        working-directory: ${{ inputs.working-directory }}
        env:
          PREFLIGHT_PREPARED: 'true'
          PREFLIGHT_SETUP: 'true'
          STEP: ${{ matrix.step }}
          BUILD_ARGS: ${{ matrix.args }}
          PREFLIGHT_JOB: ${{ matrix.cache_key }}
          # With the job's start, its deadline: a test running then ends named.
          PREFLIGHT_JOB_TIMEOUT: ${{ matrix.job_timeout }}
        run: preflight run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ inputs.working-directory }}/zig-out/preflight
          retention-days: 1
  execute:
    needs: [toolchain, compile]
    if: always() && inputs.tier == 'release' && needs.compile.result == 'success'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.release-run-matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          build-args: ${{ matrix.args }}
          build-key: ${{ matrix.step }}
          toolchain: toolchain-${{ inputs.preflight-ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.artifact }}
          path: ${{ inputs.working-directory }}/zig-out/preflight
      # The package's held git: its build, kept from run to run by its release, preflight's
      # recipe and the machine (the riscv64 machine's own builds in its tests' step).
      - name: Restore the held git
        id: held_git
        if: matrix.setup && inputs.held-git != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/preflight-git
          key: preflight-git-${{ inputs.held-git }}-r1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.machine }}
      - name: Set up test tools (attempt 1/3)
        id: tools1
        if: matrix.setup
        timeout-minutes: ${{ inputs.held-git != '' && 30 || 5 }}
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        env:
          PREFLIGHT_HELD_GIT: ${{ inputs.held-git }}
        run: preflight prepare
      - name: Set up test tools (attempt 2/3)
        id: tools2
        if: ${{ !cancelled() && steps.tools1.outcome == 'failure' }}
        timeout-minutes: ${{ inputs.held-git != '' && 30 || 5 }}
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        env:
          PREFLIGHT_HELD_GIT: ${{ inputs.held-git }}
        run: preflight prepare
      - name: Set up test tools (attempt 3/3)
        id: tools3
        if: ${{ !cancelled() && steps.tools2.outcome == 'failure' }}
        timeout-minutes: ${{ inputs.held-git != '' && 30 || 5 }}
        working-directory: ${{ inputs.working-directory }}
        env:
          PREFLIGHT_HELD_GIT: ${{ inputs.held-git }}
        run: preflight prepare
      - name: Run test executables
        working-directory: ${{ inputs.working-directory }}
        env:
          STEP: ${{ matrix.step }}
          BUILD_ARGS: ${{ matrix.args }}
          PREFLIGHT_SHARD: ${{ matrix.shard }}
          PREFLIGHT_PREPARED: 'true'
          PREFLIGHT_SETUP: ${{ matrix.setup }}
          PREFLIGHT_JOB: ${{ matrix.cache_key }}
          # With the job's start, its deadline: a test running then ends named.
          PREFLIGHT_JOB_TIMEOUT: ${{ matrix.job_timeout }}
        run: preflight run
      - name: Save the held git
        if: always() && matrix.setup && inputs.held-git != '' && steps.held_git.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/preflight-git
          key: preflight-git-${{ inputs.held-git }}-r1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.machine }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.step == 'hardened-fuzz'
        with:
          name: fuzz-${{ inputs.tier }}-${{ matrix.cache_key }}
          path: ${{ env.ZIG_LOCAL_CACHE_DIR }}/v
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: timings-${{ matrix.cache_key }}
          path: ${{ inputs.working-directory }}/.zig-cache/preflight-timings
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  # A run that went red is profiled too, its records folded as a run that did not
  # finish: a job that ran out of time leaves the record that sizes the next plan's
  # shards. Only a green run's fold is the proof artifact.
  profile:
    needs: [toolchain, gate, compile, execute]
    # The fuzz job runs no tests to time.
    if: always() && needs.gate.result == 'success' && inputs.tier != 'fuzz'
    runs-on: ubuntu-latest
    env:
      FINISHED: ${{ (needs.compile.result == 'success' || needs.compile.result == 'skipped') && (needs.execute.result == 'success' || needs.execute.result == 'skipped') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: toolchain-${{ inputs.preflight-ref }}
          path: .preflight-bin
      # Each job's records in a directory of its own: jobs on one OS and mode
      # name their records alike, and merged into one directory they overwrite
      # each other, interleaved when two downloads write one file at once.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: timings-*
          path: .preflight-timings
      - name: Refresh the per-test durations the shards balance by
        run: |
          chmod +x .preflight-bin/linux/preflight
          .preflight-bin/linux/preflight profile ${{ env.FINISHED != 'true' && '--partial' || '' }} --durations "${{ inputs.working-directory }}/ci/durations.json" --output .preflight-timings/durations.json --costs "${{ inputs.working-directory }}/ci/costs.json" --costs-output .preflight-timings/costs.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.FINISHED == 'true' && 'preflight' || 'records' }}-${{ inputs.tier }}-${{ github.sha }}
          path: |
            .preflight-timings/durations.json
            .preflight-timings/costs.json
          retention-days: 90
