name: Zig
on:
  workflow_call:
    inputs:
      tier:
        description: fast, merge or release
        type: string
        default: fast
      working-directory:
        type: string
        default: .
      preflight-ref:
        type: string
        required: true
      attest:
        type: boolean
        default: false
      fast-matrix:
        description: Static Linux Debug shards generated from ci/workflow.json
        type: string
        default: '{"include":[{"name":"Linux Debug","args":"-Doptimize=debug","shard":"","job_timeout":20,"cache_key":"fast-linux-debug-0"}]}'
      merge-matrix:
        description: Static native merge-tier matrix, zig build plan -- --tier merge
        type: string
        default: '{"include":[]}'
      merge-compile-matrix:
        type: string
        default: '{"include":[]}'
      merge-run-matrix:
        type: string
        default: '{"include":[]}'
      release-matrix:
        description: Static native release-tier matrix, zig build plan -- --tier release
        type: string
        default: '{"include":[]}'
      release-compile-matrix:
        type: string
        default: '{"include":[]}'
      release-run-matrix:
        type: string
        default: '{"include":[]}'
      compile-once:
        type: boolean
        default: false
      test-job-timeout:
        description: Zig master suite step timeout in minutes, capped at 20
        type: number
        default: 20
      windows-git-latest:
        description: Upgrade Git for Windows before setting up test tools
        type: boolean
        default: false
      windows-job-timeout:
        type: number
        default: 20
permissions:
  contents: read
  actions: read
jobs:
  tier:
    if: '!contains(fromJSON(''["fast","merge","release"]''), inputs.tier)'
    runs-on: ubuntu-latest
    steps:
      - env:
          TIER: ${{ inputs.tier }}
        run: echo "tier must be fast, merge or release, not '$TIER'" && exit 1
  # The checks are built once, for every runner, and every job takes them: no
  # job compiles the toolchain. The same job tells a fast run whether the
  # change is documentation alone, which needs none of the gate.
  toolchain:
    if: '!inputs.attest && contains(fromJSON(''["fast","merge","release"]''), inputs.tier)'
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.paths.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/toolchain
        with:
          preflight-ref: ${{ inputs.preflight-ref }}
      # preflight keeps its own run's toolchain ninety days, for the callers
      # pinned to its commit; a caller's run keeps it for the run.
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ inputs.preflight-ref }}
          path: .preflight-bin
          include-hidden-files: true
          retention-days: ${{ github.repository == 'pedronaugusto/preflight' && 90 || 1 }}
          overwrite: true
      - name: Filter paths and check documentation when it is the only change
        id: paths
        if: inputs.tier == 'fast'
        env:
          PREFLIGHT_TIER: ${{ inputs.tier }}
          PREFLIGHT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: .preflight-bin/linux/preflight skip --config "${{ inputs.working-directory }}/ci/preflight.json"
  main:
    if: inputs.attest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/toolchain
        with:
          preflight-ref: ${{ inputs.preflight-ref }}
      - name: Confirm a merge or release tier passed for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .preflight-bin/linux/preflight attest
  # A branch sees the caches of main and its own, so main keeps the one thing
  # every job of a new branch would otherwise compile for itself: the build runner.
  warm:
    if: inputs.attest && github.event_name == 'push'
    name: warm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/warm
  gate:
    needs: toolchain
    if: '!inputs.attest && needs.toolchain.outputs.docs-only != ''true'' && contains(fromJSON(''["fast","merge","release"]''), inputs.tier)'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.tier == 'release' && inputs.release-matrix || inputs.tier == 'merge' && inputs.merge-matrix || inputs.fast-matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
        with:
          windows-git-latest: ${{ inputs.windows-git-latest }}
          working-directory: ${{ inputs.working-directory }}
          build-args: ${{ matrix.args }}
          build-key: ${{ matrix.step }}
          toolchain: toolchain-${{ inputs.preflight-ref }}
      - name: Set up test tools (attempt 1/3)
        id: tools1
        if: matrix.setup
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: preflight prepare
      - name: Set up test tools (attempt 2/3)
        id: tools2
        if: ${{ !cancelled() && steps.tools1.outcome == 'failure' }}
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: preflight prepare
      - name: Set up test tools (attempt 3/3)
        id: tools3
        if: ${{ !cancelled() && steps.tools2.outcome == 'failure' }}
        timeout-minutes: 5
        working-directory: ${{ inputs.working-directory }}
        run: preflight prepare
      - name: Run the gate
        working-directory: ${{ inputs.working-directory }}
        env:
          STEP: ${{ matrix.step }}
          BUILD_ARGS: ${{ matrix.args }}
          PREFLIGHT_SHARD: ${{ matrix.shard }}
          PREFLIGHT_PREPARED: 'true'
          PREFLIGHT_SETUP: ${{ matrix.setup }}
          PREFLIGHT_TARGETS: ${{ matrix.targets }}
          PREFLIGHT_LINKS: ${{ matrix.links }}
          PREFLIGHT_JOB: ${{ matrix.cache_key }}
        run: preflight run
      - uses: actions/upload-artifact@v4
        if: always() && matrix.step == 'hardened-fuzz'
        with:
          name: fuzz-${{ inputs.tier }}-${{ matrix.cache_key }}
          path: ${{ env.ZIG_LOCAL_CACHE_DIR }}/v
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-${{ matrix.cache_key }}
          path: ${{ inputs.working-directory }}/.zig-cache/preflight-timings
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  master:
    # Zig master (the next release in development) never blocks: its result is
    # read at each merge, and a break is a note for the next port's codemod table.
    # It builds its own checks, since they must be built by the Zig they read.
    if: '!inputs.attest && (inputs.tier == ''merge'' || inputs.tier == ''release'')'
    name: Zig master (Linux Debug, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    # All step budgets total 50 minutes; a stalled step fails before this
    # cancellation bound, so continue-on-error can keep the run advisory.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
        timeout-minutes: 10
        with:
          zig-version: master
          build-args: -Doptimize=debug -Dci-lint=false
          working-directory: ${{ inputs.working-directory }}
          build-key: master-linux-debug
      - name: Set up test tools (attempt 1/3)
        id: tools1
        timeout-minutes: 5
        continue-on-error: true
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Set up test tools (attempt 2/3)
        id: tools2
        if: ${{ !cancelled() && steps.tools1.outcome == 'failure' }}
        timeout-minutes: 5
        continue-on-error: true
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Set up test tools (attempt 3/3)
        id: tools3
        if: ${{ !cancelled() && steps.tools2.outcome == 'failure' }}
        timeout-minutes: 5
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Run the Debug suite on Zig master
        id: suite
        timeout-minutes: ${{ inputs.test-job-timeout < 20 && inputs.test-job-timeout || 20 }}
        env:
          STEP: ci
          BUILD_ARGS: -Doptimize=debug -Dci-lint=false
          PREFLIGHT_PREPARED: 'true'
          PREFLIGHT_SETUP: 'true'
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" run
      - name: Report
        timeout-minutes: 1
        if: always()
        env:
          OUTCOME: ${{ steps.suite.outcome }}
          TOOLS: ${{ steps.tools1.outcome == 'success' && 'success' || steps.tools2.outcome == 'success' && 'success' || steps.tools3.outcome }}
        run: |
          version=$(zig version 2>/dev/null || echo unknown)
          echo "Zig master $version: tool setup $TOOLS; suite $OUTCOME (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" != success ]; then echo "::warning title=Zig master::$version: the Debug suite did not pass; a note for the next port"; fi
  compile:
    needs: toolchain
    if: '!inputs.attest && (inputs.tier == ''merge'' || inputs.tier == ''release'') && inputs.compile-once'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.tier == 'release' && inputs.release-compile-matrix || inputs.merge-compile-matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
        with:
          windows-git-latest: ${{ inputs.windows-git-latest }}
          working-directory: ${{ inputs.working-directory }}
          build-args: ${{ matrix.args }}
          build-key: ${{ matrix.step }}
          toolchain: toolchain-${{ inputs.preflight-ref }}
      - name: Set up test tools (attempt 1/3)
        id: tools1
        if: matrix.setup
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: preflight prepare
      - name: Set up test tools (attempt 2/3)
        id: tools2
        if: ${{ !cancelled() && steps.tools1.outcome == 'failure' }}
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: preflight prepare
      - name: Set up test tools (attempt 3/3)
        id: tools3
        if: ${{ !cancelled() && steps.tools2.outcome == 'failure' }}
        timeout-minutes: 5
        working-directory: ${{ inputs.working-directory }}
        run: preflight prepare
      - name: Link test executables with the native SDK
        working-directory: ${{ inputs.working-directory }}
        env:
          PREFLIGHT_PREPARED: 'true'
          PREFLIGHT_SETUP: 'true'
          STEP: ${{ matrix.step }}
          BUILD_ARGS: ${{ matrix.args }}
          PREFLIGHT_LINKS: ${{ matrix.links }}
          PREFLIGHT_JOB: ${{ matrix.cache_key }}
        run: preflight run
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ inputs.working-directory }}/zig-out/preflight
          retention-days: 1
  execute:
    needs: [toolchain, compile]
    if: always() && !inputs.attest && (inputs.tier == 'merge' || inputs.tier == 'release') && needs.compile.result == 'success'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.tier == 'release' && inputs.release-run-matrix || inputs.merge-run-matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
        with:
          windows-git-latest: ${{ inputs.windows-git-latest }}
          working-directory: ${{ inputs.working-directory }}
          build-args: ${{ matrix.args }}
          build-key: ${{ matrix.step }}
          toolchain: toolchain-${{ inputs.preflight-ref }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ inputs.working-directory }}/zig-out/preflight
      - name: Set up test tools (attempt 1/3)
        id: tools1
        if: matrix.setup
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: preflight prepare
      - name: Set up test tools (attempt 2/3)
        id: tools2
        if: ${{ !cancelled() && steps.tools1.outcome == 'failure' }}
        timeout-minutes: 5
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: preflight prepare
      - name: Set up test tools (attempt 3/3)
        id: tools3
        if: ${{ !cancelled() && steps.tools2.outcome == 'failure' }}
        timeout-minutes: 5
        working-directory: ${{ inputs.working-directory }}
        run: preflight prepare
      - name: Run test executables
        working-directory: ${{ inputs.working-directory }}
        env:
          STEP: ${{ matrix.step }}
          BUILD_ARGS: ${{ matrix.args }}
          PREFLIGHT_SHARD: ${{ matrix.shard }}
          PREFLIGHT_PREPARED: 'true'
          PREFLIGHT_SETUP: ${{ matrix.setup }}
          PREFLIGHT_JOB: ${{ matrix.cache_key }}
        run: preflight run
      - uses: actions/upload-artifact@v4
        if: always() && matrix.step == 'hardened-fuzz'
        with:
          name: fuzz-${{ inputs.tier }}-${{ matrix.cache_key }}
          path: ${{ env.ZIG_LOCAL_CACHE_DIR }}/v
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-${{ matrix.cache_key }}
          path: ${{ inputs.working-directory }}/.zig-cache/preflight-timings
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  profile:
    needs: [toolchain, gate, compile, execute]
    if: always() && !inputs.attest && (inputs.tier == 'merge' || inputs.tier == 'release') && needs.gate.result == 'success' && (needs.compile.result == 'success' || needs.compile.result == 'skipped') && (needs.execute.result == 'success' || needs.execute.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: toolchain-${{ inputs.preflight-ref }}
          path: .preflight-bin
      - uses: actions/download-artifact@v4
        with:
          pattern: timings-*
          path: .preflight-timings
          merge-multiple: true
      - name: Refresh the per-test durations the shards balance by
        run: |
          chmod +x .preflight-bin/linux/preflight
          .preflight-bin/linux/preflight profile --durations "${{ inputs.working-directory }}/ci/durations.json" --output .preflight-timings/durations.json --costs "${{ inputs.working-directory }}/ci/costs.json" --costs-output .preflight-timings/costs.json
      - uses: actions/upload-artifact@v4
        with:
          name: preflight-${{ inputs.tier }}-${{ github.sha }}
          path: |
            .preflight-timings/durations.json
            .preflight-timings/costs.json
          retention-days: 90
