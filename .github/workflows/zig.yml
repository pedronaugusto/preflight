name: Zig
'on':
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
      working-directory:
        type: string
        default: .
      preflight-ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: pedronaugusto/preflight
        ref: ${{ inputs.preflight-ref }}
        path: .preflight
    - id: matrix
      env:
        FULL: ${{ inputs.full }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        args=()
        if [ "$FULL" = true ]; then args+=(--full); fi
        python3 "$GITHUB_WORKSPACE/.preflight/checks/matrix.py" "${args[@]}" --output "$GITHUB_OUTPUT"
  gate:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: pedronaugusto/preflight
        ref: ${{ inputs.preflight-ref }}
        path: .preflight
    - uses: ./.preflight/.github/actions/setup
      with:
        working-directory: ${{ inputs.working-directory }}
        build-key: ${{ matrix.cache_key }}
    - name: Repository tool setup with retries
      if: matrix.setup
      run: |
        if [ -f ci/setup.sh ]; then
          for attempt in 1 2 3; do
            if bash ci/setup.sh; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep "$((5 << (attempt - 1)))"
          done
        fi
    - name: Repository probes before testing
      if: matrix.step == 'ci'
      env:
        BUILD_ARGS: ${{ matrix.args }}
      run: |
        if [ -f ci/before-tests.sh ]; then bash ci/before-tests.sh; fi
    - name: Run the gate
      env:
        STEP: ${{ matrix.step }}
        BUILD_ARGS: ${{ matrix.args }}
        CASES: ${{ matrix.cases }}
        TEST_TIMEOUT: ${{ matrix.timeout }}
      run: |
        read -r -a args <<< "$BUILD_ARGS"
        read -r -a timeout <<< "$TEST_TIMEOUT"
        if [ -n "$CASES" ]; then
          for case in $CASES; do
            zig build "$STEP" "${args[@]}" "${timeout[@]}" "-Dtest-case=$case"
          done
        else
          zig build "$STEP" "${args[@]}" "${timeout[@]}"
        fi
