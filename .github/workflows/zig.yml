name: Zig
on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
      working-directory:
        type: string
        default: .
      preflight-ref:
        type: string
        required: true
      attest:
        type: boolean
        default: false
      measured-plan:
        description: Use cached duration weights to plan the full-tier shards
        type: boolean
        default: false
      fast-matrix:
        description: Static Linux Debug shards generated from ci/workflow.json
        type: string
        default: '{"include":[{"name":"Linux Debug","args":"-Doptimize=Debug","cases":"","timeout":"","job_timeout":20,"cache_key":"fast-linux-debug-0"}]}'
      full-matrix:
        description: Static native full-tier matrix generated from ci/workflow.json
        type: string
        default: '{"include":[]}'
      compile-matrix:
        type: string
        default: '{"include":[]}'
      run-matrix:
        type: string
        default: '{"include":[]}'
      compile-once:
        type: boolean
        default: false
      test-job-timeout:
        type: number
        default: 20
      windows-job-timeout:
        type: number
        default: 20
permissions:
  contents: read
  actions: read
jobs:
  main:
    if: inputs.attest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/cache@v4
        with:
          path: .preflight/.zig-cache
          key: preflight-main-${{ runner.os }}-0.16.0-${{ inputs.preflight-ref }}
          restore-keys: |
            preflight-main-${{ runner.os }}-0.16.0-
      - name: Confirm the full gate for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: zig build --build-file .preflight/build.zig attest
  fast:
    if: '!inputs.attest && !inputs.full'
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.fast-matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          build-key: ${{ matrix.cache_key }}
      - name: Check sources, run Linux Debug and compile other test targets
        env:
          STEP: preflight-fast
          BUILD_ARGS: ${{ matrix.args }}
          CASES: ${{ matrix.cases }}
          TEST_TIMEOUT: ${{ matrix.timeout }}
          PREFLIGHT_SETUP: 'true'
          FAST_COMPILE: ${{ !contains(matrix.args, '-Dci-lint=false') }}
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" run
      - name: Verify the shared checker
        if: github.repository == 'pedronaugusto/preflight'
        run: zig build verify
      - uses: actions/upload-artifact@v4
        if: contains(matrix.args, '-Dci-timings=true')
        with:
          name: timings-${{ matrix.cache_key }}
          path: ${{ inputs.working-directory }}/.zig-cache/preflight-timings
          include-hidden-files: true
          retention-days: 7
  plan:
    if: '!inputs.attest && inputs.full && inputs.measured-plan'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      compile-matrix: ${{ steps.matrix.outputs.compile_matrix }}
      run-matrix: ${{ steps.matrix.outputs.run_matrix }}
      portable: ${{ steps.matrix.outputs.portable }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/cache/restore@v4
        with:
          path: .preflight-timings
          key: preflight-timings-${{ github.repository }}-${{ github.sha }}
          restore-keys: |
            preflight-timings-${{ github.repository }}-
      - id: matrix
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" plan -- --full "${{ inputs.full }}" --measurements "${{ github.workspace }}/.preflight-timings/summary.json"
  gate:
    needs: plan
    if: always() && !inputs.attest && inputs.full && (needs.plan.result == 'success' || (!inputs.measured-plan && needs.plan.result == 'skipped'))
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.measured-plan && needs.plan.outputs.matrix || inputs.full-matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          build-key: ${{ matrix.cache_key }}
      - name: Run the gate
        env:
          STEP: ${{ matrix.step }}
          BUILD_ARGS: ${{ matrix.args }}
          CASES: ${{ matrix.cases }}
          TEST_TIMEOUT: ${{ matrix.timeout }}
          PREFLIGHT_SETUP: ${{ matrix.setup }}
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" run
      - uses: actions/upload-artifact@v4
        if: inputs.full && matrix.step == 'ci'
        with:
          name: timings-${{ matrix.cache_key }}
          path: ${{ inputs.working-directory }}/.zig-cache/preflight-timings
          include-hidden-files: true
          retention-days: 7
  compile:
    needs: plan
    if: always() && !inputs.attest && inputs.full && (inputs.measured-plan && needs.plan.outputs.portable == 'true' || !inputs.measured-plan && inputs.compile-once)
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.measured-plan && needs.plan.outputs.compile-matrix || inputs.compile-matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          build-key: ${{ matrix.cache_key }}
      - name: Compile test executables
        env:
          STEP: ${{ matrix.step }}
          BUILD_ARGS: ${{ matrix.args }}
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" run
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ inputs.working-directory }}/zig-out/preflight
          retention-days: 1
  execute:
    needs: [plan, compile]
    if: always() && !inputs.attest && inputs.full && needs.compile.result == 'success'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.measured-plan && needs.plan.outputs.run-matrix || inputs.run-matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          build-key: execute-${{ matrix.cache_key }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ inputs.working-directory }}/zig-out/preflight
      - name: Run test executables
        env:
          STEP: ${{ matrix.step }}
          BUILD_ARGS: ${{ matrix.args }}
          TEST_TIMEOUT: ${{ matrix.timeout }}
          PREFLIGHT_SETUP: ${{ matrix.setup }}
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" run
      - uses: actions/upload-artifact@v4
        if: inputs.full
        with:
          name: timings-${{ matrix.cache_key }}
          path: ${{ inputs.working-directory }}/.zig-cache/preflight-timings
          include-hidden-files: true
          retention-days: 7
  profile:
    needs: [gate, compile, execute]
    if: always() && inputs.full && needs.gate.result == 'success' && (needs.compile.result == 'success' || needs.compile.result == 'skipped') && (needs.execute.result == 'success' || needs.execute.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/download-artifact@v4
        with:
          pattern: timings-*
          path: .preflight-timings
          merge-multiple: true
      - name: Record the next full-tier shard weights
        run: zig build --build-file .preflight/build.zig profile -- --config "${{ inputs.working-directory }}/ci/workflow.json"
      - uses: actions/cache/save@v4
        with:
          path: .preflight-timings
          key: preflight-timings-${{ github.repository }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: preflight-full-${{ github.sha }}
          path: .preflight-timings/summary.json
          retention-days: 90
