name: Zig
on:
  workflow_call:
    inputs:
      tier:
        description: fast, merge or release
        type: string
        default: fast
      adopt:
        description: Initialize absent source ledgers from exact findings already on main
        type: boolean
        default: false
      working-directory:
        type: string
        default: .
      preflight-ref:
        type: string
        required: true
      attest:
        type: boolean
        default: false
      fast-matrix:
        description: Static Linux Debug shards generated from ci/workflow.json
        type: string
        default: '{"include":[{"name":"Linux Debug","args":"-Doptimize=debug","shard":"","job_timeout":20,"cache_key":"fast-linux-debug-0"}]}'
      merge-matrix:
        description: Static native merge-tier matrix, zig build plan -- --tier merge
        type: string
        default: '{"include":[]}'
      merge-compile-matrix:
        type: string
        default: '{"include":[]}'
      merge-run-matrix:
        type: string
        default: '{"include":[]}'
      release-matrix:
        description: Static native release-tier matrix, zig build plan -- --tier release
        type: string
        default: '{"include":[]}'
      release-compile-matrix:
        type: string
        default: '{"include":[]}'
      release-run-matrix:
        type: string
        default: '{"include":[]}'
      compile-once:
        type: boolean
        default: false
      test-job-timeout:
        description: Zig master suite step timeout in minutes, capped at 20
        type: number
        default: 20
      windows-git-latest:
        description: Upgrade Git for Windows before setting up test tools
        type: boolean
        default: false
      windows-job-timeout:
        type: number
        default: 20
permissions:
  contents: read
  actions: read
jobs:
  tier:
    if: '!contains(fromJSON(''["fast","merge","release"]''), inputs.tier)'
    runs-on: ubuntu-latest
    steps:
      - env:
          TIER: ${{ inputs.tier }}
        run: echo "tier must be fast, merge or release, not '$TIER'" && exit 1
  main:
    if: inputs.attest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/cache@v4
        with:
          path: .preflight/.zig-cache
          key: preflight-main-${{ runner.os }}-0.17.0-${{ inputs.preflight-ref }}
          restore-keys: |
            preflight-main-${{ runner.os }}-0.17.0-
      - name: Confirm a merge or release tier passed for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}" attest
  fast:
    if: '!inputs.attest && inputs.tier == ''fast'''
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.fast-matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
        with:
          windows-git-latest: ${{ inputs.windows-git-latest }}
          working-directory: ${{ inputs.working-directory }}
          build-args: ${{ matrix.args }}
          build-key: ${{ matrix.cache_key }}
      - name: Set up test tools (attempt 1/3)
        id: tools1
        timeout-minutes: 5
        continue-on-error: true
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Set up test tools (attempt 2/3)
        id: tools2
        if: ${{ !cancelled() && steps.tools1.outcome == 'failure' }}
        timeout-minutes: 5
        continue-on-error: true
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Set up test tools (attempt 3/3)
        id: tools3
        if: ${{ !cancelled() && steps.tools2.outcome == 'failure' }}
        timeout-minutes: 5
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Check sources, run Linux Debug and compile other test targets
        env:
          STEP: ${{ matrix.step }}
          BUILD_ARGS: ${{ matrix.args }}
          PREFLIGHT_SHARD: ${{ matrix.shard }}
          PREFLIGHT_PREPARED: 'true'
          PREFLIGHT_SETUP: 'true'
          PREFLIGHT_LEDGER_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'origin/main' }}
          FAST_COMPILE: ${{ !contains(matrix.args, '-Dci-lint=false') }}
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" run
      - name: Verify the shared checker
        if: github.repository == 'pedronaugusto/preflight' && matrix.step == 'preflight-fast'
        run: zig build verify -Dci-bench-smoke=false
      - uses: actions/upload-artifact@v4
        if: always() && matrix.step == 'hardened-fuzz'
        with:
          name: fuzz-${{ inputs.tier }}-${{ matrix.cache_key }}
          path: ${{ env.ZIG_LOCAL_CACHE_DIR }}/v
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: contains(matrix.args, '-Dci-timings=true')
        with:
          name: timings-${{ matrix.cache_key }}
          path: ${{ inputs.working-directory }}/.zig-cache/preflight-timings
          include-hidden-files: true
          retention-days: 7
  gate:
    if: '!inputs.attest && (inputs.tier == ''merge'' || inputs.tier == ''release'')'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.tier == 'release' && inputs.release-matrix || inputs.merge-matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
        with:
          windows-git-latest: ${{ inputs.windows-git-latest }}
          working-directory: ${{ inputs.working-directory }}
          build-args: ${{ matrix.args }}
          build-key: ${{ matrix.cache_key }}
      - name: Set up test tools (attempt 1/3)
        id: tools1
        if: matrix.setup
        timeout-minutes: 5
        continue-on-error: true
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Set up test tools (attempt 2/3)
        id: tools2
        if: ${{ !cancelled() && steps.tools1.outcome == 'failure' }}
        timeout-minutes: 5
        continue-on-error: true
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Set up test tools (attempt 3/3)
        id: tools3
        if: ${{ !cancelled() && steps.tools2.outcome == 'failure' }}
        timeout-minutes: 5
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Run the gate
        env:
          STEP: ${{ matrix.step }}
          BUILD_ARGS: ${{ matrix.args }}
          PREFLIGHT_SHARD: ${{ matrix.shard }}
          PREFLIGHT_PREPARED: 'true'
          PREFLIGHT_SETUP: ${{ matrix.setup }}
          PREFLIGHT_ADOPT: ${{ inputs.adopt }}
          PREFLIGHT_LEDGER_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'origin/main' }}
          FAST_COMPILE: ${{ !contains(matrix.args, '-Dci-lint=false') }}
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" run
      - uses: actions/upload-artifact@v4
        if: always() && matrix.step == 'hardened-fuzz'
        with:
          name: fuzz-${{ inputs.tier }}-${{ matrix.cache_key }}
          path: ${{ env.ZIG_LOCAL_CACHE_DIR }}/v
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: contains(matrix.args, '-Dci-timings=true')
        with:
          name: timings-${{ matrix.cache_key }}
          path: ${{ inputs.working-directory }}/.zig-cache/preflight-timings
          include-hidden-files: true
          retention-days: 7
  master:
    # Zig master (the next release in development) never blocks: its result is
    # read at each merge, and a break is a note for the next port's codemod table.
    if: '!inputs.attest && (inputs.tier == ''merge'' || inputs.tier == ''release'')'
    name: Zig master (Linux Debug, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    # All step budgets total 50 minutes; a stalled step fails before this
    # cancellation bound, so continue-on-error can keep the run advisory.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
        timeout-minutes: 10
        with:
          zig-version: master
          build-args: -Doptimize=debug -Dci-lint=false
          working-directory: ${{ inputs.working-directory }}
          build-key: master-linux-debug
      - name: Set up test tools (attempt 1/3)
        id: tools1
        timeout-minutes: 5
        continue-on-error: true
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Set up test tools (attempt 2/3)
        id: tools2
        if: ${{ !cancelled() && steps.tools1.outcome == 'failure' }}
        timeout-minutes: 5
        continue-on-error: true
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Set up test tools (attempt 3/3)
        id: tools3
        if: ${{ !cancelled() && steps.tools2.outcome == 'failure' }}
        timeout-minutes: 5
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Run the Debug suite on Zig master
        id: suite
        timeout-minutes: ${{ inputs.test-job-timeout < 20 && inputs.test-job-timeout || 20 }}
        env:
          STEP: ci
          BUILD_ARGS: -Doptimize=debug -Dci-lint=false
          PREFLIGHT_PREPARED: 'true'
          PREFLIGHT_SETUP: 'true'
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" run
      - name: Report
        timeout-minutes: 1
        if: always()
        env:
          OUTCOME: ${{ steps.suite.outcome }}
          TOOLS: ${{ steps.tools1.outcome == 'success' && 'success' || steps.tools2.outcome == 'success' && 'success' || steps.tools3.outcome }}
        run: |
          version=$(zig version 2>/dev/null || echo unknown)
          echo "Zig master $version: tool setup $TOOLS; suite $OUTCOME (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" != success ]; then echo "::warning title=Zig master::$version: the Debug suite did not pass; a note for the next port"; fi
  compile:
    if: '!inputs.attest && (inputs.tier == ''merge'' || inputs.tier == ''release'') && inputs.compile-once'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.tier == 'release' && inputs.release-compile-matrix || inputs.merge-compile-matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
        with:
          windows-git-latest: ${{ inputs.windows-git-latest }}
          working-directory: ${{ inputs.working-directory }}
          build-args: ${{ matrix.args }}
          build-key: ${{ matrix.cache_key }}
      - name: Set up test tools (attempt 1/3)
        id: tools1
        if: matrix.setup
        timeout-minutes: 5
        continue-on-error: true
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Set up test tools (attempt 2/3)
        id: tools2
        if: ${{ !cancelled() && steps.tools1.outcome == 'failure' }}
        timeout-minutes: 5
        continue-on-error: true
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Set up test tools (attempt 3/3)
        id: tools3
        if: ${{ !cancelled() && steps.tools2.outcome == 'failure' }}
        timeout-minutes: 5
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Link test executables with the native SDK
        env:
          PREFLIGHT_PREPARED: 'true'
          PREFLIGHT_SETUP: 'true'
          STEP: ${{ matrix.step }}
          BUILD_ARGS: ${{ matrix.args }}
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" run
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ inputs.working-directory }}/zig-out/preflight
          retention-days: 1
  execute:
    needs: compile
    if: always() && !inputs.attest && (inputs.tier == 'merge' || inputs.tier == 'release') && needs.compile.result == 'success'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.tier == 'release' && inputs.release-run-matrix || inputs.merge-run-matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
        with:
          windows-git-latest: ${{ inputs.windows-git-latest }}
          working-directory: ${{ inputs.working-directory }}
          build-args: ${{ matrix.args }}
          build-key: execute-${{ matrix.cache_key }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ inputs.working-directory }}/zig-out/preflight
      - name: Set up test tools (attempt 1/3)
        id: tools1
        if: matrix.setup
        timeout-minutes: 5
        continue-on-error: true
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Set up test tools (attempt 2/3)
        id: tools2
        if: ${{ !cancelled() && steps.tools1.outcome == 'failure' }}
        timeout-minutes: 5
        continue-on-error: true
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Set up test tools (attempt 3/3)
        id: tools3
        if: ${{ !cancelled() && steps.tools2.outcome == 'failure' }}
        timeout-minutes: 5
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" prepare
      - name: Run test executables
        env:
          STEP: ${{ matrix.step }}
          BUILD_ARGS: ${{ matrix.args }}
          PREFLIGHT_SHARD: ${{ matrix.shard }}
          PREFLIGHT_PREPARED: 'true'
          PREFLIGHT_SETUP: ${{ matrix.setup }}
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" run
      - uses: actions/upload-artifact@v4
        if: always() && matrix.step == 'hardened-fuzz'
        with:
          name: fuzz-${{ inputs.tier }}-${{ matrix.cache_key }}
          path: ${{ env.ZIG_LOCAL_CACHE_DIR }}/v
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: contains(matrix.args, '-Dci-timings=true')
        with:
          name: timings-${{ matrix.cache_key }}
          path: ${{ inputs.working-directory }}/.zig-cache/preflight-timings
          include-hidden-files: true
          retention-days: 7
  profile:
    needs: [gate, compile, execute]
    if: always() && !inputs.attest && (inputs.tier == 'merge' || inputs.tier == 'release') && needs.gate.result == 'success' && (needs.compile.result == 'success' || needs.compile.result == 'skipped') && (needs.execute.result == 'success' || needs.execute.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/download-artifact@v4
        with:
          pattern: timings-*
          path: .preflight-timings
          merge-multiple: true
      - name: Refresh the per-test durations the shards balance by
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}" profile -- --durations "${{ inputs.working-directory }}/ci/durations.json" --output .preflight-timings/durations.json
      - uses: actions/upload-artifact@v4
        with:
          name: preflight-${{ inputs.tier }}-${{ github.sha }}
          path: .preflight-timings/durations.json
          retention-days: 90
