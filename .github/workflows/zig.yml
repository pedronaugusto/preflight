name: Zig
on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
      working-directory:
        type: string
        default: .
      preflight-ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - id: matrix
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" plan -- --full "${{ inputs.full }}"
  gate:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: ${{ inputs.preflight-ref }}
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
        with:
          working-directory: ${{ inputs.working-directory }}
          build-key: ${{ matrix.cache_key }}
      - name: Run the gate
        env:
          STEP: ${{ matrix.step }}
          BUILD_ARGS: ${{ matrix.args }}
          CASES: ${{ matrix.cases }}
          TEST_TIMEOUT: ${{ matrix.timeout }}
          PREFLIGHT_SETUP: ${{ matrix.setup }}
        run: zig build --build-file .preflight/build.zig -Drepo-root="${{ github.workspace }}/${{ inputs.working-directory }}" run
