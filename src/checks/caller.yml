# Generated by preflight from @WORKFLOW@
name: CI
on:
  push:
    # main, and a `land/` branch, which fast-forwards main only when its ci tier is green.
    branches: [main, 'land/**']
    # A commit that changes documentation alone runs nothing: the next commit's run, a pull
    # request and the release tier check it.
    paths-ignore: ['docs/**', '*.md']
  pull_request:
  schedule:
    # The nightly tier, the heavy legs, daily at this package's own minute: the account's
    # runners are never asked for every package's at once.
    - cron: '@NIGHTLY@'
  workflow_dispatch:
    inputs:
      tier:
        description: ci (what every push and pull request runs), release (the ci tier and the release modes, which a tag requires on its commit, with the last nightly run), nightly (the heavy legs) or fuzz (the fuzz job alone)
        type: choice
        options: [ci, release, nightly, fuzz]
        default: ci
      fuzz-minutes:
        description: The fuzz job's minutes, when not ci/workflow.json's fuzz_minutes (at most 330)
        type: string
        default: ''
concurrency:
  # Every push runs on its own commit, so each commit gets its status; a newer
  # update of a pull request replaces the run of the older; a dispatched or scheduled
  # run queues per ref and tier.
  group: ci-${{ github.event_name == 'push' && format('push-{0}', github.sha) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}-{2}', github.event_name, github.ref, github.event_name == 'schedule' && 'nightly' || inputs.tier) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  gate:
    uses: @GATE@
    with:
      tier: ${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && inputs.tier || 'ci' }}
      working-directory: @DIRECTORY@
      preflight-ref: @PIN@
@MATRICES@      fuzz-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.fuzz-minutes || '' }}
      held-git: @HELD_GIT@
